<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intact UK&amp;I — Finance &amp; Claims Data Flow Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Intact palette */
  --cyan:#01B3BD;          /* main cyan  */
  --deep:#365655;          /* dark cyan  — section bands, structure */
  --red:#DF0030;           /* main red   — RISK FIGURES ONLY */
  --sand:#E8DDC8;          /* light brown */
  --met:#9FD6B4; --part:#F2CE8A; --notmet:#FF8CA5;

  --ink:#000000; --ink-2:#2B3634; --ink-3:#6B7A78;
  --paper:#F4F2ED; --card:#FFFFFF; --rule:#D6D2C8; --rule-2:#E7E3DA;
  --wire:#8CA3A1;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

header{flex:0 0 auto;background:var(--deep);color:#fff;padding:12px 20px 11px;
  display:flex;align-items:baseline;gap:18px;border-bottom:3px solid var(--cyan)}
header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
header h1 em{font-style:normal;color:var(--cyan)}
header .sub{font-family:var(--mono);font-size:10.5px;color:#9FB4B2;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
header .spacer{flex:1}
header .stat{font-family:var(--mono);font-size:10.5px;color:#9FB4B2;white-space:nowrap}
header .stat b{color:#fff;font-weight:600}
header .stat b.risk{color:#FF8CA5}

.toolbar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:8px;padding:7px 14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{font-family:var(--sans);font-size:11.5px;font-weight:500;padding:5px 11px;
  border:0;background:#fff;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#F1EFE9}
.tbtn{font-family:var(--sans);font-size:11.5px;font-weight:500;padding:5px 11px;
  border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink-2);cursor:pointer}
.tbtn:hover{background:#F1EFE9;border-color:#BFB9AC}
.tbtn.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.tlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
#search{font-family:var(--sans);font-size:11.5px;padding:5px 9px;width:180px;
  border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink)}
#search:focus{outline:2px solid var(--cyan);outline-offset:-1px}
.divider{width:1px;height:20px;background:var(--rule)}

main{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;background:var(--paper)}
#viewport.grabbing{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#wires{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
#wires .hit{pointer-events:stroke;stroke-width:12;stroke:transparent;fill:none;cursor:pointer}

.node{position:absolute;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--cyan);border-radius:3px;padding:6px 8px 7px;
  cursor:grab;user-select:none;box-shadow:0 1px 2px rgba(54,86,85,.10);
  transition:box-shadow .12s,opacity .12s}
.node:hover{box-shadow:0 3px 10px rgba(54,86,85,.20);z-index:5}
.node.dragging{cursor:grabbing;box-shadow:0 8px 20px rgba(54,86,85,.28);z-index:20}
.node .lbl{font-size:11.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.node .sub{font-size:9.5px;color:var(--ink-3);line-height:1.25;margin-top:2px}
.node.legacy{border-left-color:#C7B38A}
.node.legacy.flag{background:var(--sand);border-left-color:var(--deep)}
.node.tgt{background:#fff;border-style:dashed;border-left:3px solid var(--deep);border-left-style:solid}
.node.sel{border-color:var(--deep);box-shadow:0 0 0 2px var(--deep),0 6px 16px rgba(54,86,85,.25);z-index:15}
.node.dim{opacity:.14}
.node.hit{box-shadow:0 0 0 2px var(--cyan)}
.node.up{box-shadow:0 0 0 2px var(--cyan)}
.node.down{box-shadow:0 0 0 2px var(--deep)}
.chip{position:absolute;top:-7px;right:-4px;font-family:var(--mono);font-size:7.5px;font-weight:700;
  letter-spacing:.06em;padding:1px 4px;border-radius:2px;line-height:1.5}
.chip.t{background:var(--deep);color:#fff}
.chip.d{background:#fff;color:var(--red);border:1px solid var(--red)}
.node .cbar{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.node .cbar span{font-family:var(--mono);font-size:7.5px;font-weight:600;color:var(--deep);
  border:1px solid var(--rule);border-radius:2px;padding:0 2px;line-height:1.5;background:#fff}

.bandlabel{font-family:var(--sans);font-weight:700;font-size:15px;fill:var(--deep)}
.bandnum{font-family:var(--mono);font-weight:600;font-size:26px;fill:var(--deep);opacity:.22}
.bandsub{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.clabel{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--deep)}
.elabel{font-family:var(--sans);font-size:9.5px;fill:var(--ink-2)}
.cdia{cursor:pointer}
.cdia text{font-family:var(--mono);font-size:7.5px;font-weight:700;fill:#fff}

#panel{flex:0 0 340px;background:var(--card);border-left:1px solid var(--rule);overflow-y:auto;padding-bottom:40px}
#panel .phead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--rule);padding:13px 16px 11px;z-index:2}
#panel .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
#panel h2{font-size:16px;font-weight:600;margin:4px 0 0;line-height:1.25}
#panel .meta{font-size:10.5px;color:var(--ink-3);margin-top:3px}
#panel .body{padding:14px 16px}
.field{margin-bottom:15px}
.field h3{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.field h3::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.field p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.flowlist{list-style:none;margin:0;padding:0}
.flowlist li{font-size:11.5px;line-height:1.4;padding:6px 0 6px 14px;border-bottom:1px solid var(--rule-2);
  position:relative;cursor:pointer;color:var(--ink-2)}
.flowlist li:hover{color:var(--ink)}
.flowlist li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.flowlist li b{font-weight:600;color:var(--ink)}
.flowlist li span{display:block;color:var(--ink-3);font-size:10.5px;margin-top:1px}
.ctl{border-bottom:1px solid var(--rule-2);padding:9px 0;cursor:pointer}
.ctl-h{display:flex;gap:8px;align-items:baseline}
.ctl-id{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--deep);padding:1px 4px;border-radius:2px}
.ctl-t{font-size:12px;font-weight:600;flex:1}
.ctl-m{font-family:var(--mono);font-size:8px;font-weight:600;padding:1px 5px;border-radius:8px;color:#1E2A29}
.ctl-d{font-size:11px;line-height:1.45;color:var(--ink-3);margin-top:4px;display:none}
.ctl.open .ctl-d{display:block}
.legend{display:flex;flex-direction:column;gap:5px}
.legend div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2)}
.swatch{width:12px;height:12px;border-radius:2px;flex:0 0 auto;border:1px solid var(--rule)}
.note{font-size:11px;line-height:1.5;color:var(--ink-3);background:#F7F5F0;border-left:2px solid var(--cyan);padding:9px 11px;border-radius:0 3px 3px 0}
.riskfig{font-family:var(--mono);font-weight:700;color:var(--red)}
kbd{font-family:var(--mono);font-size:10px;background:#F1EFE9;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--deep);
  color:#fff;font-size:12px;padding:8px 16px;border-radius:5px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== SLICER BAR ===== */
#slicers{flex:0 0 auto;background:#FBFAF7;border-bottom:1px solid var(--rule);
  padding:9px 14px 10px;display:none;gap:0;flex-direction:column}
body.filtersOpen #slicers{display:flex}
.sl-grid{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sl-grp{display:flex;flex-direction:column;gap:5px}
.sl-grp>span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.sl-chips{display:flex;gap:4px;flex-wrap:wrap;max-width:520px}
.chip-f{font-family:var(--sans);font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:11px;
  border:1px solid var(--rule);background:#fff;color:var(--ink-2);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.chip-f:hover{border-color:#B4AE9F;background:#F4F2ED}
.chip-f i{width:7px;height:7px;border-radius:2px;display:inline-block;flex:0 0 auto}
.chip-f b{font-family:var(--mono);font-size:8.5px;font-weight:600;opacity:.55}
.chip-f[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.chip-f[aria-pressed="true"] b{opacity:.75;color:#fff}
.chip-f.red[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.sl-foot{display:flex;align-items:center;gap:12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--rule-2)}
.sl-foot .msg{font-size:11px;color:var(--ink-3)}
.sl-foot .msg b{color:var(--red);font-family:var(--mono);font-weight:700}
#f-count{font-family:var(--mono);font-size:9px;font-weight:700;background:var(--red);color:#fff;
  border-radius:8px;padding:0 5px;margin-left:5px}
#f-count.zero{display:none}

/* ===== TABLE VIEW ===== */
#tableview{flex:1;overflow-y:auto;display:none;background:var(--paper)}
body.tableMode #viewport,body.tableMode #panel{display:none}
body.tableMode #tableview{display:block}
.tv-wrap{max-width:1500px;margin:0 auto;padding:30px 30px 70px}

.tv-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:end;
  border-bottom:3px solid var(--red);padding-bottom:20px}
.tv-hero .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);font-weight:600}
.tv-hero h2{font-size:32px;line-height:1.1;font-weight:700;margin:9px 0 0;letter-spacing:-.022em}
.tv-hero h2 em{font-style:normal;color:var(--red)}
.tv-hero p{font-size:13px;line-height:1.6;color:var(--ink-2);margin:0}
.tv-hero p+p{margin-top:9px}
@media (max-width:940px){.tv-hero{grid-template-columns:1fr;gap:16px}}

.tv-key{display:flex;gap:20px;flex-wrap:wrap;margin:15px 0 4px;font-size:11px;color:var(--ink-3)}
.tv-key span{display:flex;align-items:center;gap:6px}
.tv-key i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* the spine — every system sits on one chain to the ledger */
.tv-body{position:relative}
.tv-body::before{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:64px;width:2px;
  background:linear-gradient(180deg,transparent,var(--red) 40px,var(--red) calc(100% - 60px),transparent);
  opacity:.30}
@media (max-width:940px){.tv-body::before{display:none}}

.tv-stage{display:flex;align-items:center;gap:14px;margin:30px 0 14px;position:relative}
.tv-stage .num{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--red);opacity:.30;line-height:1}
.tv-stage .txt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.tv-stage .rule{flex:1;height:1px;background:var(--rule)}
.tv-stage .cnt{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}

.tv-head{display:grid;grid-template-columns:1fr 42px 250px 42px 1fr;padding:14px 0 7px;
  border-bottom:1px solid var(--rule);margin-bottom:2px}
@media (max-width:940px){.tv-head{display:none}}
.tv-head div{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.tv-head .mid{text-align:center;color:var(--red)}
.tv-head .rgt{text-align:right}

.tv-row{background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-bottom:14px;
  overflow:hidden;box-shadow:0 1px 2px rgba(54,86,85,.06);position:relative}
.tv-row:hover{box-shadow:0 5px 18px rgba(54,86,85,.13)}
.tv-row.ph{border-style:dashed;border-color:#E9A3B4;background:#FFFCFD}
.tv-cols{display:grid;grid-template-columns:1fr 42px 250px 42px 1fr;align-items:stretch}
.tv-side{padding:15px 17px 14px}
.tv-side.right{background:#FCFBF8}
.tv-item{display:flex;gap:9px;padding:5px 0}
.tv-item i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-top:6px}
.tv-item .who{font-size:12px;font-weight:600;line-height:1.3}
.tv-item .what{font-size:11.5px;line-height:1.4;color:var(--ink-3);margin-top:1px}
.tv-empty{font-size:11.5px;line-height:1.5;color:#B0455F;font-style:italic;padding:6px 0}
.tv-arrow{display:flex;align-items:center;justify-content:center;background:#FBF9F5}
.tv-arrow svg{width:16px;height:16px}

.tv-mid{background:var(--deep);color:#fff;padding:17px 14px 16px;display:flex;flex-direction:column;
  justify-content:center;text-align:center;position:relative;border-top:4px solid var(--red)}
.tv-row.ph .tv-mid{background:#5A3A44}
.tv-mid .nm{font-size:16.5px;font-weight:700;letter-spacing:-.012em;line-height:1.15}
.tv-mid .rl{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan);margin-top:5px}
.tv-mid .wt{font-size:11.5px;line-height:1.45;color:#D6E2E1;margin-top:9px}
.tv-mid .tags{display:flex;gap:4px;justify-content:center;margin-top:11px;flex-wrap:wrap}
.tv-tag{font-family:var(--mono);font-size:7.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:2px}
.tv-tag.exit{background:var(--red);color:#fff}
.tv-tag.doc{background:var(--met);color:#1E2A29}
.tv-tag.part{background:var(--part);color:#1E2A29}
.tv-tag.ph{background:var(--notmet);color:#3A0A18}
/* the spine node — sits in the gap between rows, on the red thread */
.tv-row::after{content:"";position:absolute;left:calc(50% - 5px);top:-8px;width:10px;height:10px;
  border-radius:50%;background:var(--red);border:2px solid var(--paper);z-index:2}
.tv-row.ph::after{background:#fff;border:2px solid var(--red)}
@media (max-width:940px){.tv-row::after{display:none}}

.tv-story{padding:13px 17px 14px;background:#F7F5F0;border-top:1px solid var(--rule-2);
  display:flex;gap:11px;align-items:flex-start}
.tv-story b{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;padding-top:3px}
.tv-story p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}

.tv-note{background:#FFF4F6;border-top:1px solid #FBD9E1;padding:9px 17px;
  font-size:11.5px;line-height:1.45;color:#8A1330;display:flex;gap:9px}
.tv-note b{color:var(--red);font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;
  text-transform:uppercase;white-space:nowrap;padding-top:2px}

.tv-more{border-top:1px solid var(--rule-2);background:#fff}
.tv-toggle{width:100%;border:0;background:none;padding:9px 17px;cursor:pointer;text-align:left;
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  color:var(--deep);display:flex;align-items:center;gap:8px}
.tv-toggle:hover{background:#F7F5F0}
.tv-toggle .caret{transition:transform .18s;display:inline-block;color:var(--red)}
.tv-row.open .tv-toggle .caret{transform:rotate(90deg)}
.tv-drawer{display:none;padding:2px 17px 18px;grid-template-columns:1fr 1fr 1fr;gap:22px}
.tv-row.open .tv-drawer{display:grid}
@media (max-width:940px){.tv-drawer{grid-template-columns:1fr}.tv-cols{grid-template-columns:1fr}
  .tv-arrow{height:26px;transform:rotate(90deg)}}
.tv-pane h4{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 7px;display:flex;align-items:center;gap:6px}
.tv-pane h4::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.tv-pane ul{margin:0;padding:0;list-style:none}
.tv-pane li{font-size:11.5px;line-height:1.45;padding:4px 0 4px 13px;position:relative;color:var(--ink-2)}
.tv-pane li::before{content:"";position:absolute;left:1px;top:10px;width:5px;height:5px;border-radius:1px}
.tv-pane.acc li::before{background:var(--cyan)}
.tv-pane.sox li::before{background:var(--deep)}
.tv-gap{background:#FFF7F9;border:1px dashed #E9A3B4;border-radius:4px;padding:7px 9px;margin-bottom:6px;
  font-size:11.5px;line-height:1.45;color:#7C1730;outline:none}
.tv-gap:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 2px rgba(223,0,48,.12)}
.tv-gap:empty::before{content:"Type the open question here…";color:#C88FA0}
.tv-addgap{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;
  background:none;border:1px dashed var(--rule);border-radius:4px;padding:4px 8px;cursor:pointer;
  color:var(--ink-3);width:100%}
.tv-addgap:hover{border-color:var(--red);color:var(--red)}

.tv-count{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:26px 0 0;text-align:center}
.tv-count b{color:var(--red);font-weight:700}
@media print{
  body.tableMode #tableview{display:block!important}
  .tv-row{break-inside:avoid;box-shadow:none}
  .tv-drawer{display:grid!important}
  .tv-toggle{display:none}
  @page{size:A3 portrait;margin:10mm}
}

@media print{header,.toolbar,#panel{display:none!important}body{overflow:visible;height:auto}
  #viewport{overflow:visible;background:#fff}@page{size:A2 landscape;margin:8mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Intact UK&amp;I <em>/</em> Finance &amp; Claims Data Flow Map</h1>
  <span class="sub">Source &rarr; Ledger &rarr; Reporting</span>
  <span class="spacer"></span>
  <span class="stat"><b id="s-nodes">0</b> systems &nbsp;·&nbsp; <b id="s-edges">0</b> flows &nbsp;·&nbsp;
  <b id="s-ctl">0</b> controls &nbsp;·&nbsp; <b class="risk" id="s-risk">0</b> exit candidates</span>
</header>

<div class="toolbar">
  <div class="seg" id="seg-mode">
    <button data-m="map" aria-pressed="true">Map</button>
    <button data-m="table" aria-pressed="false">Table</button>
  </div>
  <div class="divider"></div>
  <span class="tlabel">View</span>
  <div class="seg" id="seg-view">
    <button data-v="cur" aria-pressed="true">Current</button>
    <button data-v="tgt" aria-pressed="false">Target</button>
    <button data-v="both" aria-pressed="false">Both</button>
  </div>
  <div class="divider"></div>
  <button class="tbtn" id="t-labels">Flow labels</button>
  <button class="tbtn on" id="t-ctl">Control points</button>
  <button class="tbtn" id="t-decom">Highlight exits</button>
  <div class="divider"></div>
  <button class="tbtn" id="t-filters">Filters<span id="f-count" class="zero">0</span></button>
  <input id="search" type="search" placeholder="Find a system…" autocomplete="off">
  <div class="divider"></div>

</script>
<script>
/* ===================== layout constants ===================== */
const NW=160, NH=66, GX=18, GY=18;
const CPAD=13, CHEAD=24, CGAP=26;
const BHEAD=60, MARGIN=60, CANVAS_W=2760;
const LANE_SP=13, LANE_TOP=26, LANE_BOT=26, MIN_GAP=64, CORNER=7;

const nodeById={}; NODES.forEach(n=>nodeById[n.id]=n);
const clusterById={}; CLUSTERS.forEach(c=>clusterById[c.id]=c);
const bandById={}; BANDS.forEach(b=>bandById[b.id]=b);
const ctlById={}; CONTROLS.forEach(c=>ctlById[c.id]=c);
const bandIndex={}; BANDS.forEach((b,i)=>bandIndex[b.id]=i);
NODES.forEach(n=>{n.band=clusterById[n.cluster].band; n.dx=0; n.dy=0;});

const state={view:'cur',labels:false,ctl:true,decom:false,sel:null,query:'',collapsed:{}};
const MODE_COL={auto:'var(--met)',semi:'var(--part)',manual:'var(--notmet)'};
const MODE_TXT={auto:'AUTOMATED',semi:'SEMI-AUTO',manual:'MANUAL'};

function visibleNode(n){
  let ok;
  if(state.view==='both') ok=true;
  else if(state.view==='cur') ok=(n.state==='cur'||n.state==='both');
  else ok=(n.state==='tgt'||n.state==='both');
  return ok && (typeof nodePasses==='function' ? nodePasses(n) : true);
}
function visibleEdge(e){
  const a=nodeById[e.f], b=nodeById[e.t];
  if(!a||!b||!visibleNode(a)||!visibleNode(b)) return false;
  if(state.collapsed[a.band]||state.collapsed[b.band]) return false;
  if(state.view==='cur'&&e.kind==='tgt') return false;
  if(state.view==='tgt'&&e.kind!=='tgt'&&!(a.state!=='cur'&&b.state!=='cur')) return false;
  return (typeof edgePasses==='function' ? edgePasses(e) : true);
}

/* ===================== layout ===================== */
let LAYOUT={w:CANVAS_W,h:0,bands:[],clusters:[],gapAfter:{}};

function layoutPass(gapAfter){
  const bands=[], clusters=[];
  let y=MARGIN;
  BANDS.forEach(band=>{
    if(!NODES.some(n=>n.band===band.id&&visibleNode(n))) return;
    const top=y;
    if(state.collapsed[band.id]){
      bands.push({...band,y:top,h:46,collapsed:true});
      y+=46+(gapAfter[band.id]||MIN_GAP); return;
    }
    let x=MARGIN, rowH=0, rowTop=top+BHEAD;
    CLUSTERS.filter(c=>c.band===band.id).forEach(cl=>{
      const ns=NODES.filter(n=>n.cluster===cl.id&&visibleNode(n));
      if(!ns.length) return;
      const cols=Math.min(cl.cols,ns.length), rows=Math.ceil(ns.length/cols);
      const w=cols*NW+(cols-1)*GX+CPAD*2, h=rows*NH+(rows-1)*GY+CPAD*2+CHEAD;
      if(x+w>CANVAS_W-MARGIN&&x>MARGIN){x=MARGIN;rowTop+=rowH+CGAP;rowH=0;}
      ns.forEach((n,i)=>{n.ax=x+CPAD+(i%cols)*(NW+GX);
                         n.ay=rowTop+CPAD+CHEAD+Math.floor(i/cols)*(NH+GY);});
      clusters.push({...cl,x,y:rowTop,w,h});
      x+=w+CGAP; rowH=Math.max(rowH,h);
    });
    const h=(rowTop+rowH)-top+CPAD;
    bands.push({...band,y:top,h,collapsed:false});
    y=top+h+(gapAfter[band.id]||MIN_GAP);
  });
  NODES.forEach(n=>{n.x=(n.ax||0)+n.dx; n.y=(n.ay||0)+n.dy;});
  return {w:CANVAS_W,h:y+MARGIN,bands,clusters,gapAfter};
}

/* ---- port allocation: spread connections across box edges ---- */
function allocPorts(edges){
  const outs={}, ins={};
  edges.forEach(e=>{(outs[e.f]=outs[e.f]||[]).push(e); (ins[e.t]=ins[e.t]||[]).push(e);});
  for(const id in outs){
    const list=outs[id].filter(e=>e.dir==='down');
    list.sort((a,b)=>nodeById[a.t].x-nodeById[b.t].x);
    list.forEach((e,i)=>{e.sx=nodeById[id].x+NW*(i+1)/(list.length+1);});
    outs[id].filter(e=>e.dir!=='down').forEach(e=>{e.sx=nodeById[id].x+NW;});
  }
  for(const id in ins){
    const list=ins[id].filter(e=>e.dir==='down');
    list.sort((a,b)=>nodeById[a.f].x-nodeById[b.f].x);
    list.forEach((e,i)=>{e.tx=nodeById[id].x+NW*(i+1)/(list.length+1);});
    ins[id].filter(e=>e.dir!=='down').forEach(e=>{e.tx=nodeById[id].x+NW;});
  }
}

/* ---- lane packing: horizontal runs share a gap without overlapping ---- */
function packLanes(edges,bands){
  const byBand={};
  const bandOf={}; bands.forEach(b=>bandOf[b.id]=b);
  edges.forEach(e=>{
    if(e.dir!=='down') return;
    const sb=nodeById[e.f].band;
    (byBand[sb]=byBand[sb]||[]).push(e);
  });
  const laneCount={};
  for(const bid in byBand){
    const list=byBand[bid].slice().sort((a,b)=>
      (Math.abs(a.tx-a.sx))-(Math.abs(b.tx-b.sx)));
    const lanes=[];
    list.forEach(e=>{
      const lo=Math.min(e.sx,e.tx)-10, hi=Math.max(e.sx,e.tx)+10;
      let placed=false;
      for(let i=0;i<lanes.length;i++){
        if(lanes[i].every(iv=>hi<iv[0]||lo>iv[1])){lanes[i].push([lo,hi]);e.lane=i;placed=true;break;}
      }
      if(!placed){lanes.push([[lo,hi]]);e.lane=lanes.length-1;}
    });
    laneCount[bid]=lanes.length;
  }
  return laneCount;
}

function computeLayout(){
  recomputeConnected();
  const edges=EDGES.filter(visibleEdge);
  edges.forEach(e=>{
    const a=nodeById[e.f], b=nodeById[e.t];
    const ai=bandIndex[a.band], bi=bandIndex[b.band];
    e.dir = bi>ai ? 'down' : (bi<ai ? 'up' : 'side');
  });
  // pass 1 — rough positions with a minimum gap
  const g1={}; BANDS.forEach(b=>g1[b.id]=MIN_GAP);
  let L=layoutPass(g1);
  allocPorts(edges);
  let lanes=packLanes(edges,L.bands);
  // pass 2 — grow each gap to fit its lanes
  const g2={}; BANDS.forEach(b=>g2[b.id]=Math.max(MIN_GAP,LANE_TOP+LANE_BOT+(lanes[b.id]||0)*LANE_SP));
  L=layoutPass(g2);
  allocPorts(edges);
  lanes=packLanes(edges,L.bands);
  L.lanes=lanes; L.edges=edges;
  L.right=Math.max(...L.clusters.map(c=>c.x+c.w), MARGIN+600)+CPAD;
  LAYOUT=L;
  return L;
}

/* ===================== path building ===================== */
function ortho(pts,r){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1],[cx,cy]=pts[i],[nx,ny]=pts[i+1];
    const d1=Math.hypot(cx-px,cy-py), d2=Math.hypot(nx-cx,ny-cy);
    const rr=Math.min(r,d1/2,d2/2);
    const ax=cx-(cx-px)/(d1||1)*rr, ay=cy-(cy-py)/(d1||1)*rr;
    const bx=cx+(nx-cx)/(d2||1)*rr, by=cy+(ny-cy)/(d2||1)*rr;
    d+=` L${ax},${ay} Q${cx},${cy} ${bx},${by}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0]},${last[1]}`;
  return d;
}

function bandBottom(bid){const b=LAYOUT.bands.find(x=>x.id===bid);return b?b.y+b.h:0;}

function buildPath(e){
  const a=nodeById[e.f], b=nodeById[e.t];
  if(e.dir==='down'){
    const y0=a.y+NH, y1=b.y;
    const laneY=bandBottom(a.band)+LANE_TOP+(e.lane||0)*LANE_SP;
    if(Math.abs(e.sx-e.tx)<2) return {d:ortho([[e.sx,y0],[e.sx,y1]],CORNER),lx:e.sx,ly:(y0+y1)/2,run:0};
    return {d:ortho([[e.sx,y0],[e.sx,laneY],[e.tx,laneY],[e.tx,y1]],CORNER),
            lx:(e.sx+e.tx)/2, ly:laneY, run:Math.abs(e.tx-e.sx)};
  }
  if(e.dir==='up'){
    const trunk=(LAYOUT.right||CANVAS_W)+22+((e.trunk||0)*11);
    const y0=a.y+NH/2, y1=b.y+NH/2;
    return {d:ortho([[a.x+NW,y0],[trunk,y0],[trunk,y1],[b.x+NW,y1]],CORNER),
            lx:trunk, ly:(y0+y1)/2, run:Math.abs(y1-y0), vertical:true};
  }
  const l2r=b.x>=a.x;
  const x0=l2r?a.x+NW:a.x, x1=l2r?b.x:b.x+NW;
  const y0=a.y+NH/2, y1=b.y+NH/2;
  const mid=(x0+x1)/2;
  if(Math.abs(y0-y1)<2) return {d:ortho([[x0,y0],[x1,y1]],CORNER),lx:mid,ly:y0,run:Math.abs(x1-x0)};
  return {d:ortho([[x0,y0],[mid,y0],[mid,y1],[x1,y1]],CORNER),lx:mid,ly:(y0+y1)/2,run:Math.abs(y1-y0)};
}

/* ===================== render ===================== */
const world=document.getElementById('world'), svg=document.getElementById('wires');
const SVGNS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

function relatives(id){
  const up=new Set(), down=new Set();
  const vis=EDGES.filter(visibleEdge);
  const walk=(cur,dir,seen)=>{vis.forEach(e=>{
    const from=dir==='down'?e.f:e.t, to=dir==='down'?e.t:e.f;
    if(from===cur&&!seen.has(to)){seen.add(to);walk(to,dir,seen);}});};
  walk(id,'down',down); walk(id,'up',up);
  return {up,down};
}

function render(){
  computeLayout(); drawSVG(); drawNodes();
  document.getElementById('s-nodes').textContent=NODES.filter(visibleNode).length;
  document.getElementById('s-edges').textContent=EDGES.filter(visibleEdge).length;
  document.getElementById('s-ctl').textContent=CONTROLS.length;
  document.getElementById('s-risk').textContent=NODES.filter(n=>visibleNode(n)&&n.flag==='decom').length;
}

function drawSVG(){
  const L=LAYOUT;
  const R=L.right, TOT=R+190;
  world.style.width=TOT+'px'; world.style.height=L.h+'px';
  svg.setAttribute('width',TOT); svg.setAttribute('height',L.h);
  svg.innerHTML='';
  const defs=el('defs');
  [['ar','#8CA3A1'],['ar-c','#01B3BD'],['ar-d','#365655']].forEach(([id,c])=>{
    const m=el('marker',{id,viewBox:'0 0 8 8',refX:'7',refY:'4',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    m.appendChild(el('path',{d:'M0,0 L8,4 L0,8 z',fill:c})); defs.appendChild(m);});
  svg.appendChild(defs);
  const gBand=el('g'),gCl=el('g'),gEdge=el('g'),gLab=el('g'),gDia=el('g');
  svg.append(gBand,gCl,gEdge,gLab,gDia);

  L.bands.forEach(b=>{
    gBand.appendChild(el('rect',{x:MARGIN-30,y:b.y,width:R-(MARGIN-30)+30,height:b.h,rx:6,
      fill:'#365655','fill-opacity':.035,stroke:'#365655','stroke-opacity':.20}));
    const g=el('g',{style:'cursor:pointer'}); g.dataset.band=b.id;
    const t1=el('text',{x:MARGIN-8,y:b.y+30,class:'bandnum'}); t1.textContent=b.n;
    const t2=el('text',{x:MARGIN+24,y:b.y+26,class:'bandlabel'}); t2.textContent=b.label;
    const t3=el('text',{x:MARGIN+24,y:b.y+41,class:'bandsub'}); t3.textContent=b.sub;
    const t4=el('text',{x:R+24,y:b.y+26,class:'clabel','text-anchor':'end'});
    t4.textContent=state.collapsed[b.id]?'EXPAND +':'COLLAPSE −';
    g.append(t1,t2,t3,t4);
    g.addEventListener('click',()=>{state.collapsed[b.id]=!state.collapsed[b.id];render();});
    gBand.appendChild(g);
    if(b.id==='b6'&&!b.collapsed){
      const n=L.edges.filter(e=>nodeById[e.t].band==='b6'&&nodeById[e.f].band!=='b6').length;
      if(n){
        gBand.appendChild(el('line',{x1:MARGIN-30,y1:b.y+BHEAD-6,x2:R+30,y2:b.y+BHEAD-6,
          stroke:'#01B3BD','stroke-width':2.5}));
        const t=el('text',{x:R+24,y:b.y+BHEAD-14,class:'clabel','text-anchor':'end',fill:'#DF0030'});
        t.textContent=`${n} FLOWS CROSS INTO THE LEDGER  \u25BC`;
        gBand.appendChild(t);
      }
    }
  });

  L.clusters.forEach(c=>{
    gCl.appendChild(el('rect',{x:c.x,y:c.y,width:c.w,height:c.h,rx:4,fill:'#fff','fill-opacity':.66,
      stroke:'#365655','stroke-opacity':.26,'stroke-dasharray':'3 3'}));
    const t=el('text',{x:c.x+CPAD,y:c.y+16,class:'clabel'}); t.textContent=c.label; gCl.appendChild(t);
  });

  let up=new Set(),down=new Set();
  if(state.sel){const r=relatives(state.sel);up=r.up;down=r.down;}
  const inScope=id=>!state.sel||id===state.sel||up.has(id)||down.has(id);

  // trunk index for return edges so they don't stack
  L.edges.filter(e=>e.dir==='up').forEach((e,i)=>e.trunk=i%12);

  const labelBoxes=[];
  const overlaps=(r)=>labelBoxes.some(o=>!(r.x+r.w<o.x||r.x>o.x+o.w||r.y+r.h<o.y||r.y>o.y+o.h));

  L.edges.forEach(e=>{
    const P=buildPath(e); e._p=P;
    const active=!state.sel||(inScope(e.f)&&inScope(e.t));
    const isTgt=e.kind==='tgt', isRet=e.kind==='ret'||e.dir==='up';
    const stroke=isTgt?'#365655':(isRet?'#01B3BD':'#8CA3A1');
    const base=state.sel?(active?.95:.05):(isTgt?.55:.40);
    const p=el('path',{d:P.d,fill:'none',stroke,'stroke-linejoin':'round',
      'stroke-width':state.sel&&active?1.9:1.1,'stroke-opacity':base,
      'stroke-dasharray':isTgt?'5 4':'','marker-end':`url(#${isTgt?'ar-d':(isRet?'ar-c':'ar')})`});
    gEdge.appendChild(p);
    const hit=el('path',{d:P.d,class:'hit'});
    hit.addEventListener('click',ev=>{ev.stopPropagation();showEdge(e);});
    hit.addEventListener('mouseenter',()=>{p.setAttribute('stroke-width',2.6);p.setAttribute('stroke-opacity',1);});
    hit.addEventListener('mouseleave',()=>{p.setAttribute('stroke-width',state.sel&&active?1.9:1.1);p.setAttribute('stroke-opacity',base);});
    gEdge.appendChild(hit);

    // labels live in the empty lane between bands, never behind a box
    const wantLabel=e.label&&P.run>70&&!P.vertical&&(state.labels||(state.sel&&active&&(e.f===state.sel||e.t===state.sel)));
    if(wantLabel){
      const txt=e.label.length>56?e.label.slice(0,54)+'…':e.label;
      const w=txt.length*4.7+10, h=13;
      const box={x:P.lx-w/2,y:P.ly-h/2-6,w,h};
      if(!overlaps(box)){
        labelBoxes.push(box);
        gLab.appendChild(el('rect',{x:box.x,y:box.y,width:w,height:h,rx:2,fill:'#F4F2ED',
          stroke:'#D6D2C8','stroke-width':.8}));
        const t=el('text',{x:P.lx,y:box.y+9.5,class:'elabel','text-anchor':'middle'});
        t.textContent=txt; gLab.appendChild(t);
      }
    }
    if(e.ctl&&state.ctl){
      const c=ctlById[e.ctl]; const ring=c?({auto:'#9FD6B4',semi:'#F2CE8A',manual:'#FF8CA5'})[c.m]:'#fff';
      const dx=P.vertical?P.lx:(P.run>70?P.lx+(P.run/4):P.lx);
      const g=el('g',{class:'cdia',transform:`translate(${dx},${P.ly})`,
        opacity:state.sel&&!active?.10:1});
      g.appendChild(el('rect',{x:-9.5,y:-9.5,width:19,height:19,transform:'rotate(45)',rx:2,fill:ring}));
      g.appendChild(el('rect',{x:-7,y:-7,width:14,height:14,transform:'rotate(45)',rx:1.5,fill:'#365655'}));
      const t=el('text',{y:2.7,'text-anchor':'middle'}); t.textContent=e.ctl.replace('C','');
      g.appendChild(t);
      g.addEventListener('click',ev=>{ev.stopPropagation();showControl(e.ctl);});
      gDia.appendChild(g);
    }
  });
}

function drawNodes(){
  let up=new Set(),down=new Set();
  if(state.sel){const r=relatives(state.sel);up=r.up;down=r.down;}
  const q=state.query.trim().toLowerCase();
  world.querySelectorAll('.node').forEach(n=>n.remove());
  NODES.filter(n=>visibleNode(n)&&!state.collapsed[n.band]).forEach(n=>{
    const d=document.createElement('div');
    d.className='node'; d.dataset.id=n.id;
    d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${NW}px;min-height:${NH}px`;
    if(n.state==='tgt') d.classList.add('tgt');
    else if(n.flag==='decom'){ d.classList.add('legacy'); if(state.decom) d.classList.add('flag'); }
    if(state.sel===n.id) d.classList.add('sel');
    else if(state.sel){ if(up.has(n.id))d.classList.add('up'); else if(down.has(n.id))d.classList.add('down'); else d.classList.add('dim'); }
    if(q){ if((n.label+' '+n.sub).toLowerCase().includes(q)) d.classList.add('hit'); else d.classList.add('dim'); }
    let chip='';
    if(n.state==='tgt') chip='<span class="chip t">TARGET</span>';
    else if(n.flag==='decom'&&state.decom) chip='<span class="chip d">EXIT</span>';
    const cbar=(n.d.ctl&&n.d.ctl.length&&state.ctl)?`<div class="cbar">${n.d.ctl.map(c=>`<span>${c}</span>`).join('')}</div>`:'';
    d.innerHTML=`${chip}<div class="lbl">${n.label}</div><div class="sub">${n.sub}</div>${cbar}`;
    world.appendChild(d);
  });
}

const vp=document.getElementById('viewport');

vp.addEventListener('wheel',e=>{e.preventDefault();
  const r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const nk=Math.min(2.4,Math.max(.10,k*(e.deltaY<0?1.12:1/1.12)));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; apply();},{passive:false});

let pan=null,drag=null;
vp.addEventListener('pointerdown',e=>{
  const nd=e.target.closest('.node');
  if(nd&&!nd.querySelector('[contenteditable="true"]')){

    nd.classList.add('dragging'); nd.setPointerCapture(e.pointerId);
  } else if(!e.target.closest('.cdia')&&!e.target.closest('[data-band]')){
    pan={sx:e.clientX,sy:e.clientY,tx,ty}; vp.classList.add('grabbing');}
});
window.addEventListener('pointermove',e=>{
  if(drag){
    const dx=(e.clientX-drag.sx)/k, dy=(e.clientY-drag.sy)/k;
    if(Math.abs(dx)>1.5||Math.abs(dy)>1.5) drag.moved=true;
    drag.n.dx=drag.ox+dx; drag.n.dy=drag.oy+dy;
    drag.n.x=drag.n.ax+drag.n.dx; drag.n.y=drag.n.ay+drag.n.dy;
    drag.el.style.left=drag.n.x+'px'; drag.el.style.top=drag.n.y+'px';
    drawSVG();
  } else if(pan){tx=pan.tx+(e.clientX-pan.sx); ty=pan.ty+(e.clientY-pan.sy); apply();}
});

  if(drag){drag.el.classList.remove('dragging');

/* ===================== slicers ===================== */
const F={band:new Set(),life:new Set(),freq:new Set(),own:new Set(),ctl:new Set(),ctlOnly:false,flow:new Set(),isolate:false,status:new Set()};
let ISO_PASS=false, CONNECTED=null;
function recomputeConnected(){
  if(!F.isolate){CONNECTED=null;return;}
  ISO_PASS=true; CONNECTED=new Set();
  EDGES.filter(visibleEdge).forEach(e=>{CONNECTED.add(e.f);CONNECTED.add(e.t);});
  ISO_PASS=false;
}

function freqTags(n){
  const f=(n.d.freq||'').toLowerCase(), t=[];
  if(/real time|continuous|30 minute|programme/.test(f)) t.push('live');
  if(/daily|nightly|each pay|pay run/.test(f)) t.push('daily');
  if(/month/.test(f)) t.push('monthly');
  if(/quarter|half-year|annual/.test(f)) t.push('quarterly');
  if(/required|periodic|ad hoc|working day/.test(f)) t.push('adhoc');
  return t.length?t:['adhoc'];
}
function ownTag(n){
  const o=n.d.own||'';
  if(/Target state/.test(o)) return 'target';
  if(/Wipro|ADM/.test(o)) return 'adm';
  if(/Finance Systems/.test(o)) return 'finsys';
  if(/Group Finance|FP&A|Reinsurance Finance|Credit Control|Tax|Payroll & Tax/.test(o)) return 'groupfin';
  if(/Finance|Procurement/.test(o)) return 'finance';
  if(/Actuarial/.test(o)) return 'act';
  if(/Treasury|Cash Management/.test(o)) return 'treas';
  if(/Claims|Data Platform|Operations|Counter Fraud|Central MI/.test(o)) return 'claims';
  if(/HR/.test(o)) return 'hr';
  return 'vendor';
}
function lifeTag(n){ return n.state==='tgt'?'target':(n.flag==='decom'?'retiring':'staying'); }
NODES.forEach(n=>{n._freq=freqTags(n); n._own=ownTag(n); n._life=lifeTag(n);});

const OWN_LBL={adm:'ADM / Wipro',finsys:'Finance Systems',finance:'Finance',groupfin:'Group Finance',
  act:'Actuarial',treas:'Treasury & Cash',claims:'Claims & Data',hr:'HR & Payroll',
  vendor:'Vendor / third party',target:'Target state'};
const FREQ_LBL={live:'Real time',daily:'Daily',monthly:'Monthly',quarterly:'Quarterly',adhoc:'Periodic / ad hoc'};
const LIFE_LBL={staying:'Staying',retiring:'Retiring',target:'Target only'};
const CTL_LBL={auto:'Automated',semi:'Semi-automated',manual:'Manual'};
const FLOW_LBL={fwd:'Forward',ret:'Returning',tgt:'Target-state'};

function nodePasses(n){
  if(F.band.size&&!F.band.has(n.band)) return false;
  if(F.life.size&&!F.life.has(n._life)) return false;
  if(F.freq.size&&!n._freq.some(t=>F.freq.has(t))) return false;
  if(F.own.size&&!F.own.has(n._own)) return false;
  if(F.isolate&&!ISO_PASS&&CONNECTED&&!CONNECTED.has(n.id)) return false;
  return true;
}
function edgePasses(e){
  if(F.ctlOnly&&!e.ctl) return false;
  if(F.ctl.size){ if(!e.ctl) return false; const c=ctlById[e.ctl]; if(!c||!F.ctl.has(c.m)) return false; }
  if(F.flow.size){ const k=e.kind==='tgt'?'tgt':(e.kind==='ret'?'ret':'fwd'); if(!F.flow.has(k)) return false; }
  return true;
}
function activeCount(){return F.band.size+F.life.size+F.freq.size+F.own.size+F.ctl.size+F.flow.size+F.status.size+(F.ctlOnly?1:0)+(F.isolate?1:0);}

function chip(group,val,label,swatch,count,red){
  const on=(group==='ctlOnly')?F.ctlOnly:((group==='isolate')?F.isolate:F[group].has(val));
  return `<button class="chip-f${red?' red':''}" aria-pressed="${on}" data-g="${group}" data-v="${val}">
    ${swatch?`<i style="background:${swatch}"></i>`:''}${label}${count!=null?`<b>${count}</b>`:''}</button>`;
}
function renderSlicers(){
  const vis=n=>visibleNode(n);
  const cnt=(fn)=>NODES.filter(n=>vis(n)&&fn(n)).length;
  const eAll=EDGES.filter(e=>{const a=nodeById[e.f],b=nodeById[e.t];
    return a&&b&&visibleNode(a)&&visibleNode(b);});
  const ec=m=>eAll.filter(e=>e.ctl&&ctlById[e.ctl]&&ctlById[e.ctl].m===m).length;
  const ef=k=>eAll.filter(e=>(e.kind==='tgt'?'tgt':(e.kind==='ret'?'ret':'fwd'))===k).length;
  document.getElementById('slicers').innerHTML=`
  <div class="sl-grid">
    <div class="sl-grp"><span>Layer</span><div class="sl-chips">
      ${BANDS.map(b=>chip('band',b.id,`${b.n}. ${b.label}`,'#365655',cnt(n=>n.band===b.id))).join('')}
    </div></div>
    <div class="sl-grp"><span>Lifecycle</span><div class="sl-chips">
      ${['staying','retiring','target'].map(l=>chip('life',l,LIFE_LBL[l],
        l==='retiring'?'#DF0030':(l==='target'?'#365655':'#01B3BD'),cnt(n=>n._life===l),l==='retiring')).join('')}
    </div></div>
    <div class="sl-grp"><span>How often it runs</span><div class="sl-chips">
      ${Object.keys(FREQ_LBL).map(f=>chip('freq',f,FREQ_LBL[f],null,cnt(n=>n._freq.includes(f)))).join('')}
    </div></div>
    <div class="sl-grp"><span>Who runs it</span><div class="sl-chips">
      ${Object.keys(OWN_LBL).map(o=>chip('own',o,OWN_LBL[o],null,cnt(n=>n._own===o)))
        .filter((h,i)=>!h.includes('<b>0</b>')).join('')}
    </div></div>
    <div class="sl-grp"><span>Flow type</span><div class="sl-chips">
      ${Object.keys(FLOW_LBL).map(k=>chip('flow',k,FLOW_LBL[k],
        k==='tgt'?'#365655':(k==='ret'?'#01B3BD':'#8CA3A1'),ef(k))).join('')}
    </div></div>
    <div class="sl-grp"><span>How complete our picture is <b style="font-weight:400;text-transform:none;letter-spacing:0">(table)</b></span><div class="sl-chips">
      ${chip('status','documented','Documented','#9FD6B4',APPS.filter(a=>a.status==='documented').length)}
      ${chip('status','partial','Partly known','#F2CE8A',APPS.filter(a=>a.status==='partial').length)}
      ${chip('status','placeholder','Needs filling in','#FF8CA5',APPS.filter(a=>a.status==='placeholder').length,true)}
    </div></div>
    <div class="sl-grp"><span>Control on the flow</span><div class="sl-chips">
      ${Object.keys(CTL_LBL).map(m=>chip('ctl',m,CTL_LBL[m],
        {auto:'#9FD6B4',semi:'#F2CE8A',manual:'#FF8CA5'}[m],ec(m))).join('')}
      ${chip('ctlOnly',1,'Only flows with a control',null,eAll.filter(e=>e.ctl).length,true)}
      ${chip('isolate',1,'Hide systems left with no flows',null,null,true)}
    </div></div>
  </div>
  <div class="sl-foot">
    <button class="tbtn" id="f-clear">Clear all filters</button>
    <span class="msg" id="f-msg"></span>
  </div>`;
  document.querySelectorAll('#slicers .chip-f').forEach(b=>b.addEventListener('click',()=>{
    const g=b.dataset.g, v=b.dataset.v;
    if(g==='ctlOnly') F.ctlOnly=!F.ctlOnly;
    else if(g==='isolate') F.isolate=!F.isolate;
    else { F[g].has(v)?F[g].delete(v):F[g].add(v); }
    applyFilters();
  }));
  document.getElementById('f-clear').addEventListener('click',()=>{
    F.band.clear();F.life.clear();F.freq.clear();F.own.clear();F.ctl.clear();F.flow.clear();F.status.clear();F.ctlOnly=false;F.isolate=false;
    applyFilters(); toast('Filters cleared');
  });
  const n=activeCount();
  const inView=x=>state.view==='both'||(state.view==='cur'?(x.state==='cur'||x.state==='both'):(x.state==='tgt'||x.state==='both'));
  const tot=NODES.filter(inView).length;
  const shown=NODES.filter(x=>visibleNode(x)).length;
  const flowsShown=EDGES.filter(visibleEdge).length;
  const flowsTot=eAll.length;
  document.getElementById('f-msg').innerHTML = n
    ? `<b>${n}</b> filter${n===1?'':'s'} on &nbsp;·&nbsp; <b>${shown}</b> of ${tot} systems &nbsp;·&nbsp; <b>${flowsShown}</b> of ${flowsTot} flows`
    : `No filters on &nbsp;·&nbsp; all ${tot} systems, ${flowsTot} flows`;
  const badge=document.getElementById('f-count');
  badge.textContent=n; badge.classList.toggle('zero',n===0);
}
function applyFilters(){
  state.sel=null;
  if(document.body.classList.contains('tableMode')) renderTable(); else { showHome(); render(); fit(); }
  renderSlicers();
}
document.getElementById('t-filters').addEventListener('click',e=>{
  document.body.classList.toggle('filtersOpen');
  e.currentTarget.classList.toggle('on',document.body.classList.contains('filtersOpen'));
  if(document.body.classList.contains('filtersOpen')) renderSlicers();
});

/* ===================== table view ===================== */
const CHEV=`<svg viewBox="0 0 24 24" fill="none" stroke="#DF0030" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l7 8-7 8"/><path d="M13 4l5 8-5 8" opacity=".38"/></svg>`;

const STAGES=[
 {k:'s1',bands:['b1','b2'],num:'01',txt:'Where business is written and claims are handled'},
 {k:'s2',bands:['b3','b4'],num:'02',txt:'Where the data is gathered, checked and given its ledger coding'},
 {k:'s3',bands:['b5'],      num:'03',txt:'Where premium is earned and claims are estimated'},
 {k:'s4',bands:['b6'],      num:'04',txt:'Where it becomes the ledger, and where money leaves the business'},
 {k:'s5',bands:['b7'],      num:'05',txt:'Where the actuarial and IFRS 17 numbers are produced'},
 {k:'s6',bands:['b8'],      num:'06',txt:'Where it becomes the reported accounts'},
];
const ST_TAG={documented:['doc','DOCUMENTED'],partial:['part','PARTIAL'],placeholder:['ph','TO BE FILLED IN']};

function tableRows(){
  const q=state.query.trim().toLowerCase();
  return APPS.filter(a=>{
    const hay=(a.name+' '+a.role+' '+a.what+' '+(a.story||'')+' '+
      a.in.map(x=>x.join(' ')).join(' ')+' '+a.out.map(x=>x.join(' ')).join(' ')+' '+
      (a.accounts||[]).join(' ')+' '+(a.sox||[]).join(' ')+' '+(a.gaps||[]).join(' ')).toLowerCase();
    if(q&&!hay.includes(q)) return false;
    if(F.band.size&&!F.band.has(a.band)) return false;
    if(F.status.size&&!F.status.has(a.status)) return false;
    if(F.life.size){const l=a.exit?'retiring':'staying'; if(!F.life.has(l)) return false;}
    return true;});
}

function rowHTML(a){
  const item=(pair,dir)=>`<div class="tv-item"><i style="background:${dir==='in'?'var(--cyan)':'var(--red)'}"></i>
      <div><div class="who">${esc(pair[0])}</div><div class="what">${esc(pair[1])}</div></div></div>`;
  const empty=side=>`<div class="tv-empty">Not documented yet — we know this system exists but not what
      ${side==='in'?'feeds it':'it feeds'}. Open the drawer below and note what you find out.</div>`;
  const [tc,tl]=ST_TAG[a.status]||ST_TAG.partial;
  return `
  <div class="tv-row${a.status==='placeholder'?' ph':''}" data-app="${a.id}">
    <div class="tv-cols">
      <div class="tv-side">${a.in.length?a.in.map(x=>item(x,'in')).join(''):empty('in')}</div>
      <div class="tv-arrow">${CHEV}</div>
      <div class="tv-mid">
        <div class="nm">${esc(a.name)}</div>
        <div class="rl">${esc(a.role)}</div>
        <div class="wt">${esc(a.what)}</div>
        <div class="tags">
          <span class="tv-tag ${tc}">${tl}</span>
          ${a.exit?'<span class="tv-tag exit">RETIRING</span>':''}
        </div>
      </div>
      <div class="tv-arrow">${CHEV}</div>
      <div class="tv-side right">${a.out.length?a.out.map(x=>item(x,'out')).join(''):empty('out')}</div>
    </div>
    ${a.story?`<div class="tv-story"><b>In plain terms</b><p>${esc(a.story)}</p></div>`:''}
    ${a.note?`<div class="tv-note"><b>Watch this</b><span>${esc(a.note)}</span></div>`:''}
    <div class="tv-more">
      <button class="tv-toggle"><span class="caret">&#9656;</span>
        What it drives &nbsp;·&nbsp; what SOX looks at &nbsp;·&nbsp; open items (${(a.gaps||[]).length})</button>
      <div class="tv-drawer">
        <div class="tv-pane acc"><h4>What it drives in the accounts</h4>
          <ul>${(a.accounts||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="tv-pane sox"><h4>What an ITGC / SOX reviewer looks at</h4>
          <ul>${(a.sox||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="tv-pane"><h4>Open items — type straight into these</h4>
          <div class="gapbox">${(a.gaps||[]).map((g,i)=>
            `<div class="tv-gap" contenteditable="true" data-app="${a.id}" data-i="${i}">${esc(g)}</div>`).join('')}</div>
          <button class="tv-addgap" data-add="${a.id}">+ Add an open item</button></div>
      </div>
    </div>
  </div>`;
}

function renderTable(){
  const rows=tableRows();
  let html='';
  STAGES.forEach(st=>{
    const grp=rows.filter(a=>st.bands.includes(a.band)&&a.status!=='placeholder');
    if(!grp.length) return;
    html+=`<div class="tv-stage"><span class="num">${st.num}</span><span class="txt">${st.txt}</span>
      <span class="rule"></span><span class="cnt">${grp.length} system${grp.length===1?'':'s'}</span></div>`;
    html+=grp.map(rowHTML).join('');
  });
  const ph=rows.filter(a=>a.status==='placeholder');
  if(ph.length){
    html+=`<div class="tv-stage"><span class="num" style="color:var(--red);opacity:.5">&#9679;</span>
      <span class="txt">Not yet mapped — we know these exist and have not documented them</span>
      <span class="rule"></span><span class="cnt">${ph.length} system${ph.length===1?'':'s'}</span></div>`;
    html+=ph.map(rowHTML).join('');
  }
  document.getElementById('tableview').innerHTML=`
  <div class="tv-wrap">
    <div class="tv-hero">
      <div>
        <div class="eyebrow">Intact Insurance UK &amp; Ireland &middot; finance and claims systems</div>
        <h2>What goes <em>in</em>, what the system does, what comes <em>out</em>.</h2>
      </div>
      <div>
        <p>One row per system, read left to right. The left column is who sends data in and what that data
        actually is. The right column is where it goes next. Underneath each row, in plain terms, is what
        actually happens &mdash; who does what, in what order.</p>
        <p>Open the drawer on any row for what it drives in the accounts, what an ITGC or SOX reviewer
        would look at, and the open items still to resolve.</p>
      </div>
    </div>
    <div class="tv-key">
      <span><i style="background:var(--cyan)"></i>Data coming in</span>
      <span><i style="background:var(--red)"></i>Data going out</span>
      <span><i style="background:var(--met)"></i>Documented from source</span>
      <span><i style="background:var(--part)"></i>Partly known</span>
      <span><i style="background:var(--notmet)"></i>Placeholder &mdash; needs filling in</span>
    </div>
    <div class="tv-body">
      <div class="tv-head"><div>Data comes in from</div><div></div>
        <div class="mid">System</div><div></div><div class="rgt">Data goes out to</div></div>
      ${html||'<p class="tv-count">Nothing matches the current filters.</p>'}</div>
    <p class="tv-count">Showing <b>${rows.length}</b> of ${APPS.length} systems
      &nbsp;&middot;&nbsp; <b>${APPS.filter(a=>a.status!=='documented').length}</b> still to complete</p>
  </div>`;

  document.querySelectorAll('.tv-toggle').forEach(t=>t.addEventListener('click',e=>{
    e.stopPropagation(); t.closest('.tv-row').classList.toggle('open');}));
  document.querySelectorAll('.tv-mid').forEach(m=>m.addEventListener('click',()=>{
    const id=m.closest('.tv-row').dataset.app;
    if(nodeById[id]){setMode('map'); showNode(id); render(); fit();}
    else toast('This system is not on the map yet — it is a placeholder');}));
  document.querySelectorAll('.tv-gap').forEach(g=>g.addEventListener('blur',()=>{
    const a=APPS.find(x=>x.id===g.dataset.app); if(!a) return;
    a.gaps[+g.dataset.i]=g.textContent.trim(); toast('Noted — use Save layout to keep it');}));
  document.querySelectorAll('.tv-addgap').forEach(btn=>btn.addEventListener('click',()=>{
    const a=APPS.find(x=>x.id===btn.dataset.add); if(!a) return;
    a.gaps=a.gaps||[]; a.gaps.push('');
    const open=[...document.querySelectorAll('.tv-row.open')].map(r=>r.dataset.app);
    renderTable();
    open.forEach(id=>{const r=document.querySelector(`.tv-row[data-app="${id}"]`); if(r) r.classList.add('open');});
    const boxes=document.querySelectorAll(`.tv-gap[data-app="${a.id}"]`);
    if(boxes.length) boxes[boxes.length-1].focus();}));
}

function setMode(m){
  document.body.classList.toggle('tableMode',m==='table');
  document.querySelectorAll('#seg-mode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
  if(m==='table') renderTable(); else { render(); fit(); }
}
document.querySelectorAll('#seg-mode button').forEach(b=>
  b.addEventListener('click',()=>setMode(b.dataset.m)));

showHome(); render(); fit();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intact UK&amp;I — Finance &amp; Claims Data Flow Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131A22; --ink-2:#3E4C5A; --ink-3:#6C7C8C;
  --paper:#EDF0F3; --card:#FFFFFF; --rule:#CFD8E0; --rule-2:#E3E9EE;
  --b1:#2E5E8C; --b2:#157F76; --b3:#8A6A2F; --b4:#9B3350;
  --b5:#4C4A9E; --b6:#A8791A; --b7:#7A4A8C; --b8:#2F6B57;
  --brass:#A8791A; --tgt:#1F7A4C; --warn:#B03A2E;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- masthead ---------- */
header{
  flex:0 0 auto; background:var(--ink); color:#fff;
  padding:12px 20px 11px; display:flex; align-items:baseline; gap:18px;
  border-bottom:3px solid var(--brass);
}
header h1{
  font-size:15px; font-weight:600; letter-spacing:.01em; margin:0; white-space:nowrap;
}
header h1 em{font-style:normal;color:var(--brass)}
header .sub{
  font-family:var(--mono); font-size:10.5px; color:#93A3B3;
  letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
}
header .spacer{flex:1}
header .stat{font-family:var(--mono);font-size:10.5px;color:#93A3B3;white-space:nowrap}
header .stat b{color:#fff;font-weight:600}

/* ---------- toolbar ---------- */
.toolbar{
  flex:0 0 auto; background:var(--card); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:8px; padding:7px 14px; flex-wrap:wrap;
}
.seg{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{
  font-family:var(--sans);font-size:11.5px;font-weight:500;padding:5px 11px;
  border:0;background:#fff;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule-2);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#F2F5F8}
.tbtn{
  font-family:var(--sans);font-size:11.5px;font-weight:500;padding:5px 11px;
  border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink-2);cursor:pointer;
}
.tbtn:hover{background:#F2F5F8;border-color:#B6C2CD}
.tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:1px}
#search{
  font-family:var(--sans);font-size:11.5px;padding:5px 9px;width:180px;
  border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink);
}
#search:focus{outline:2px solid var(--b1);outline-offset:-1px}
.divider{width:1px;height:20px;background:var(--rule)}

/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;background:
  linear-gradient(var(--rule-2) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--rule-2) 1px,transparent 1px) 0 0/28px 28px,var(--paper);}
#viewport.grabbing{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#wires{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
#wires .hit{pointer-events:stroke;stroke-width:14;stroke:transparent;fill:none;cursor:pointer}

/* ---------- nodes ---------- */
.node{
  position:absolute;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--nc,#888);border-radius:4px;padding:6px 8px 7px;
  cursor:grab;user-select:none;box-shadow:0 1px 2px rgba(19,26,34,.07);
  transition:box-shadow .12s,opacity .12s;
}
.node:hover{box-shadow:0 3px 9px rgba(19,26,34,.16);z-index:5}
.node.dragging{cursor:grabbing;box-shadow:0 8px 20px rgba(19,26,34,.24);z-index:20}
.node .lbl{font-size:11.5px;font-weight:600;line-height:1.2;letter-spacing:-.005em}
.node .sub{font-size:9.5px;color:var(--ink-3);line-height:1.25;margin-top:2px}
.node[contenteditable] .lbl{outline:none}
.node.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),0 6px 16px rgba(19,26,34,.2);z-index:15}
.node.dim{opacity:.16}
.node.hit{box-shadow:0 0 0 2px var(--brass),0 4px 12px rgba(168,121,26,.3)}
.node.up{box-shadow:0 0 0 2px var(--b1)}
.node.down{box-shadow:0 0 0 2px var(--b6)}
.node.tgt{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#F0F8F3 6px,#F0F8F3 12px);border-style:dashed}
.chip{
  position:absolute;top:-7px;right:-5px;font-family:var(--mono);font-size:8px;font-weight:600;
  letter-spacing:.06em;padding:1px 4px;border-radius:3px;line-height:1.4;
}
.chip.t{background:var(--tgt);color:#fff}
.chip.d{background:var(--warn);color:#fff}
.node .cbar{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.node .cbar span{
  font-family:var(--mono);font-size:7.5px;font-weight:600;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:2px;padding:0 2px;line-height:1.5;
}

/* ---------- svg text ---------- */
.bandlabel{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bandnum{font-family:var(--mono);font-weight:600;font-size:26px;opacity:.2}
.bandsub{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.clabel{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.elabel{font-family:var(--sans);font-size:9.5px;fill:var(--ink-2)}
.elabel-bg{fill:#fff;stroke:var(--rule-2);stroke-width:1;rx:2}
.cdia{cursor:pointer}
.cdia text{font-family:var(--mono);font-size:7.5px;font-weight:700;fill:#fff}

/* ---------- panel ---------- */
#panel{
  flex:0 0 336px;background:var(--card);border-left:1px solid var(--rule);
  overflow-y:auto;padding:0 0 40px;
}
#panel .phead{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--rule);
  padding:13px 16px 11px;z-index:2;
}
#panel .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
#panel h2{font-size:16px;font-weight:600;margin:4px 0 0;letter-spacing:-.015em;line-height:1.25}
#panel .meta{font-size:10.5px;color:var(--ink-3);margin-top:3px}
#panel .body{padding:14px 16px}
.field{margin-bottom:15px}
.field h3{
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px;display:flex;align-items:center;gap:6px;
}
.field h3::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.field p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.flowlist{list-style:none;margin:0;padding:0}
.flowlist li{
  font-size:11.5px;line-height:1.4;padding:6px 0 6px 14px;border-bottom:1px solid var(--rule-2);
  position:relative;cursor:pointer;color:var(--ink-2);
}
.flowlist li:hover{color:var(--ink)}
.flowlist li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--dot,var(--ink-3))}
.flowlist li b{font-weight:600;color:var(--ink)}
.flowlist li span{display:block;color:var(--ink-3);font-size:10.5px;margin-top:1px}
.ctl{border-bottom:1px solid var(--rule-2);padding:9px 0;cursor:pointer}
.ctl:hover .ctl-t{color:var(--brass)}
.ctl-h{display:flex;gap:8px;align-items:baseline}
.ctl-id{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--brass);padding:1px 4px;border-radius:2px}
.ctl-t{font-size:12px;font-weight:600;letter-spacing:-.005em}
.ctl-d{font-size:11px;line-height:1.45;color:var(--ink-3);margin-top:4px;display:none}
.ctl.open .ctl-d{display:block}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.legend div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2)}
.swatch{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.note{font-size:11px;line-height:1.5;color:var(--ink-3);background:#F5F7F9;border-left:2px solid var(--rule);padding:9px 11px;border-radius:0 3px 3px 0}
kbd{font-family:var(--mono);font-size:10px;background:#F2F5F8;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px}

#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;font-size:12px;padding:8px 16px;border-radius:5px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  header,.toolbar,#panel{display:none!important}
  body{overflow:visible;height:auto}
  #viewport{overflow:visible;background:#fff}
  @page{size:A2 landscape;margin:8mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Intact UK&amp;I <em>/</em> Finance &amp; Claims Data Flow Map</h1>
  <span class="sub">Source &rarr; Ledger &rarr; Reporting</span>
  <span class="spacer"></span>
  <span class="stat"><b id="s-nodes">0</b> systems &nbsp;·&nbsp; <b id="s-edges">0</b> flows &nbsp;·&nbsp; <b id="s-ctl">0</b> control points</span>
</header>

<div class="toolbar">
  <span class="tlabel">View</span>
  <div class="seg" id="seg-view">
    <button data-v="cur" aria-pressed="true">Current</button>
    <button data-v="tgt" aria-pressed="false">Target</button>
    <button data-v="both" aria-pressed="false">Both</button>
  </div>
  <div class="divider"></div>
  <button class="tbtn" id="t-labels">Flow labels</button>
  <button class="tbtn on" id="t-ctl">Control points</button>
  <button class="tbtn" id="t-decom">Highlight exits</button>
  <div class="divider"></div>
  <input id="search" type="search" placeholder="Find a system…" autocomplete="off">
  <div class="divider"></div>
  <button class="tbtn" id="t-fit">Fit</button>
  <button class="tbtn" id="t-reset">Reset layout</button>
  <span class="spacer" style="flex:1"></span>
  <button class="tbtn" id="t-save">Save layout</button>
  <button class="tbtn" id="t-load">Load layout</button>
  <button class="tbtn" id="t-print">Print / PDF</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>

<main>
  <div id="viewport"><div id="world"><svg id="wires"></svg></div></div>
  <aside id="panel"></aside>
</main>
<div id="toast"></div>

<script>/* ============================================================
   Intact (formerly RSA) UK&I — Finance & Claims Data Flow Map
   Data model: bands -> clusters -> nodes, plus edges & controls
   ============================================================ */

const BANDS = [
  { id:'b1', n:'1', label:'Origination',            sub:'Where data is first created — policy & claims administration', color:'#2E5E8C' },
  { id:'b2', n:'2', label:'Claims Platform & Azure Data Platform', sub:'Guidewire core, policy/claims ODS, lake, marts', color:'#157F76' },
  { id:'b3', n:'3', label:'Transport',              sub:'Managed file transfer, gateways and landing areas', color:'#8A6A2F' },
  { id:'b4', n:'4', label:'Integration',            sub:'Single Integration Layer — enrich, map, reconcile, split', color:'#9B3350' },
  { id:'b5', n:'5', label:'Finance Data Store',     sub:'TDS / ADS / CDS / RDS — the finance data warehouse', color:'#4C4A9E' },
  { id:'b6', n:'6', label:'General Ledger & Cash',  sub:'SAP ECC, subledgers, payments, treasury & banking', color:'#A8791A' },
  { id:'b7', n:'7', label:'Calculation Engines',    sub:'Actuarial reserving and IFRS 17 measurement', color:'#7A4A8C' },
  { id:'b8', n:'8', label:'Reporting & Control',    sub:'Management, statutory, regulatory reporting and reconciliation', color:'#2F6B57' },
];

const CLUSTERS = [
  // Band 1
  { id:'c-pas-core',  band:'b1', label:'Personal & commercial policy admin', cols:5 },
  { id:'c-pas-spec',  band:'b1', label:'Specialty, international & Ireland', cols:5 },
  { id:'c-claims',    band:'b1', label:'Claims administration', cols:4 },
  { id:'c-pas-tgt',   band:'b1', label:'Target policy platforms', cols:3 },
  // Band 2
  { id:'c-gw',        band:'b2', label:'Core claims platform (AWS)', cols:4 },
  { id:'c-az-in',     band:'b2', label:'Azure — ingest, ODS & migration', cols:4 },
  { id:'c-az-lake',   band:'b2', label:'Azure — data lake & curated marts', cols:4 },
  { id:'c-az-svc',    band:'b2', label:'Azure — services, analytics & governance', cols:4 },
  // Band 3
  { id:'c-mft',       band:'b3', label:'Managed file transfer & gateways', cols:4 },
  { id:'c-land',      band:'b3', label:'Landing areas', cols:3 },
  // Band 4
  { id:'c-sil',       band:'b4', label:'Single Integration Layer (IBM DataStage)', cols:3 },
  { id:'c-ref',       band:'b4', label:'Reference & master data', cols:2 },
  // Band 5
  { id:'c-fds',       band:'b5', label:'Finance Data Store (SQL Server / DataStage)', cols:4 },
  { id:'c-fdsout',    band:'b5', label:'FDS distribution', cols:3 },
  // Band 6
  { id:'c-sap',       band:'b6', label:'SAP ECC — ledger & subledgers', cols:3 },
  { id:'c-feeders',   band:'b6', label:'Ledger feeders & manual input', cols:3 },
  { id:'c-pay',       band:'b6', label:'Payments, collections & cash', cols:4 },
  { id:'c-treas',     band:'b6', label:'Treasury & banking', cols:4 },
  // Band 7
  { id:'c-act',       band:'b7', label:'Actuarial reserving', cols:3 },
  { id:'c-calc',      band:'b7', label:'IFRS 17 & measurement engines', cols:3 },
  // Band 8
  { id:'c-mi',        band:'b8', label:'Management & regulatory reporting', cols:4 },
  { id:'c-group',     band:'b8', label:'Group consolidation & disclosure', cols:3 },
  { id:'c-plan',      band:'b8', label:'Planning, allocation & reconciliation control', cols:3 },
  { id:'c-tgt-fin',   band:'b8', label:'Target finance platform (Intact / Oracle)', cols:5 },
];

/* state: 'cur' = current only | 'tgt' = target only | 'both'
   flag : 'decom' = decommission / exit target                       */
const N = (id,label,sub,cluster,state,flag,d) =>
  ({id,label,sub,cluster,state:state||'cur',flag:flag||null,d:d||{}});

const NODES = [
/* ---------------- BAND 1 — ORIGINATION ---------------- */
N('ais','AIS','Personal lines PAS (mainframe)','c-pas-core','cur','decom',{
  in:'Policy quote, issue, MTA, renewal and cancellation events captured by personal lines operations and aggregator/PCW channels.',
  proc:'Nightly batch builds a combined AISnnnnn extract carrying both premium transactions and a small number of reinsurance claim transactions. A separate AIB file carries balance-sheet-only movements.',
  out:'AIPnnnnn (revenue) and AIBnnnnn (balance sheet) direct-FTP to the SIL landing area; policy data also replicated to the Azure Policy ODS.',
  freq:'Daily', own:'ADM', ctl:['C1','C2']}),
N('ukris','UKRIS','Commercial & broker PAS (mainframe)','c-pas-core','cur','decom',{
  in:'Commercial and broker-placed policy transactions across multiple lines, plus reinsurance cessions.',
  proc:'Separate extracts for gross premium (NHP/NOR), reinsurance premium, gross claims, reinsurance claims paid and reinsurance OCR.',
  out:'CPF premium files daily and reinsurance files monthly, direct-FTP to SIL. Also feeds the Azure Policy ODS and hosts the SICS Profin file handoff.',
  freq:'Daily / monthly', own:'ADM', ctl:['C1']}),
N('stage2','Stage 2 / SAUNA','Personal & household PAS (mainframe)','c-pas-core','cur','decom',{
  in:'Household and personal policy transactions, including legacy books.',
  proc:'Single daily STAGE2_TDS_ALL extract of gross premium movements; SAUNA claims are carried through CCS.',
  out:'Direct-FTP CPF to SIL; coverage-level rows are later aggregated to policy-version level for SAP.',
  freq:'Daily', own:'ADM', ctl:['C1']}),
N('duckcreek','Duck Creek / Unity','Personal lines PAS','c-pas-core','cur','decom',{
  in:'Personal motor, home and pet policy transactions written on the Unity platform, plus Duck Creek Billing cash.',
  proc:'ADM writes the extract to a staging share; GlobalScape collects it with no LoB involvement.',
  out:'DCT premium CPF daily via GlobalScape; billing and cash flow separately into SAP AP/AR.',
  freq:'Daily', own:'ADM', ctl:['C1']}),
N('transactor','Transactor','MT Smart Wheels telematics PAS','c-pas-core','cur','decom',{
  in:'Telematics-rated motor policy transactions administered by Traks Global.',
  proc:'Third-party hosted extract collected from an external SFTP endpoint. VAT adjustments are posted by FDS WD1 automation rather than by the source.',
  out:'TRN premium CPF daily via GlobalScape.',
  freq:'Daily', own:'Traks Global', ctl:['C1','C11']}),
N('ice','ICE / IBSuite','Personal replatform PAS','c-pas-core','cur',null,{
  in:'Policy transactions on the ICE and IB Suite platforms introduced by the personal lines replatforming programme.',
  proc:'Vendor-hosted extract with premium and balance-sheet transactions in a single file.',
  out:'ICE_TDS_PREM and IBS_TDS_PREM CPF daily via GlobalScape; related claims arrive through CCS.',
  freq:'Daily', own:'ICE / IBA', ctl:['C1']}),
N('hood','Hood','Pet / affinity PAS','c-pas-core','cur',null,{
  in:'Affinity book policy transactions administered by Hood on the ICE platform.',
  proc:'Vendor extract of premium and balance-sheet movements.',
  out:'HOD_TDS_PREM CPF daily via GlobalScape; claims via CCS.',
  freq:'Daily', own:'Hood', ctl:['C1']}),
N('mthome','MT Home / Home TPA / Pet','Outsourced personal books','c-pas-core','cur',null,{
  in:'Policy and claim activity for outsourced personal lines books administered by third-party administrators.',
  proc:'Files originate outside the Intact network and must pass through the DMZ SFTP landing area before reaching SIL.',
  out:'CPF / CCF files daily via the DMZ landing area.',
  freq:'Daily', own:'TPA', ctl:['C1']}),

N('atlas','Atlas','Global Europe & Risk Solutions PAS','c-pas-spec','cur','decom',{
  in:'Global Europe and Risk Solutions commercial policy transactions, including UK, Continental Europe and Ireland ledger sites.',
  proc:'Confirmed premium extracted daily; pipeline premium and OCR monthly. Atlas Ireland and Ministry of Defence rows are filtered out of both the SAP and TDS feeds by SIL.',
  out:'ATLAS_TDS_COPRM / PPRM / CLMS / OCR direct-FTP to SIL; eight separate SAP interface files by entity.',
  freq:'Daily / monthly', own:'ADM', ctl:['C1','C2']}),
N('synergy','Synergy','Marine PAS','c-pas-spec','cur','decom',{
  in:'Marine premium, claims and outstanding claims reserves, including Xchanging LIMNET market bordereaux pulled in via GlobalScape.',
  proc:'Monthly extract cycle. Market files from Xchanging are collected from a third-party SFTP server and uploaded to Synergy first.',
  out:'SYN premium, claims and OCR files monthly to SIL; SYNPRM / SYNCLMS / SYNOCR to SAP.',
  freq:'Monthly', own:'ADM', ctl:['C1']}),
N('ip','IP Global Network','Multi-territory network PAS','c-pas-spec','cur','decom',{
  in:'International programme business written across the global network, including inward and outward network arrangements.',
  proc:'SIL generates additional balancing transactions to move money between legal entities for IP, and applies Global Network office overrides.',
  out:'IP premium (Mon–Fri), claims daily and OCR monthly to SIL; IPGPREM / IPGCLMS / IPGOCR to SAP.',
  freq:'Daily / monthly', own:'ADM', ctl:['C1','C2']}),
N('eclipse','Eclipse','London market & DIFC PAS (Sequel)','c-pas-spec','cur','decom',{
  in:'London market and DIFC work-in-progress premium and claims written on the Sequel Eclipse platform.',
  proc:'Vendor-hosted files collected from Sequel managed SFTP and relayed by GlobalScape.',
  out:'ECLIPSE and ECLDIFC premium and claims files daily; ECPREM / ECCLMS to SAP.',
  freq:'Daily', own:'Sequel', ctl:['C1']}),
N('profin','SICS Profin','Professional & financial lines PAS','c-pas-spec','cur','decom',{
  in:'Professional and financial products policy, claims and OCR transactions administered by DXC.',
  proc:'Monthly vendor extract routed from the UKRIS host through GlobalScape into the SIL DMZ landing area.',
  out:'SPR premium, claims and OCR monthly; SPRPREM / SPRCLMS / SPROCR to SAP.',
  freq:'Monthly', own:'DXC', ctl:['C1']}),
N('dxc','DXC Assure C&S','Commercial & Specialty PAS','c-pas-spec','both',null,{
  in:'Commercial and Specialty policy transactions on the DXC Assure platform, introduced to the finance estate in late 2024.',
  proc:'DXC generates a nightly CPF containing the previous day\'s financial movements plus any records rejected and since corrected. Distribution and risk-class rules use Geo_Code rather than the AIS-specific geography key.',
  out:'DXC_TDS_PREM CPF daily via GlobalScape and the DMZ; SIL_SAP_DXC outgoing file to SAP. Claims on DXC policies arrive through the Guidewire CCF.',
  freq:'Daily', own:'DXC', ctl:['C1','C2']}),
N('genius','Ireland Genius','Ireland PAS','c-pas-spec','cur',null,{
  in:'Republic of Ireland policy and claims transactions consolidated on the Genius iSeries.',
  proc:'Ireland-specific GPC mapping including non-refundable premium treatment; company code overrides applied in SIL.',
  out:'GEN_TDS_PREM and GEN_TDS_CLM daily, pushed by Irish GlobalScape; GENPREM / GENCLMS to SAP.',
  freq:'Daily', own:'ADM Ireland', ctl:['C1','C11']}),
N('sapiens','Sapiens RI','Reinsurance treaty administration','c-pas-spec','cur',null,{
  in:'Outward reinsurance treaty structures, cessions and reinsurer panel data.',
  proc:'Treaty results are enriched by the reinsurance team and reconciled in the Counterparty Data Store.',
  out:'Reinsurance transactions to CDS and to SAP for settlement.',
  freq:'Monthly / quarterly', own:'Finance', ctl:['C16']}),
N('pivot','Pivot Point','Specialty PAS','c-pas-spec','cur',null,{
  in:'Specialty lines policy administration.',
  proc:'Feeds the finance estate as a source data system within the policy and claims administration group.',
  out:'Premium transactions into the finance source data layer.',

<script>
/* =======================================================================
   Layout engine
   ======================================================================= */
const NW=158, NH=64, GX=16, GY=16;
const CPAD=13, CHEAD=24, CGAP=26;
const BHEAD=62, BGAP=30, MARGIN=56, CANVAS_W=2700;

const nodeById = {}; NODES.forEach(n=>nodeById[n.id]=n);
const clusterById = {}; CLUSTERS.forEach(c=>clusterById[c.id]=c);
const bandById = {}; BANDS.forEach(b=>bandById[b.id]=b);
const ctlById = {}; CONTROLS.forEach(c=>ctlById[c.id]=c);
NODES.forEach(n=>{ n.band = clusterById[n.cluster].band; n.dx=0; n.dy=0; });

const state = { view:'cur', labels:false, ctl:true, decom:false, sel:null, query:'', collapsed:{} };

function visibleNode(n){
  if(state.view==='both') return true;
  if(state.view==='cur')  return n.state==='cur'||n.state==='both';
  return n.state==='tgt'||n.state==='both';
}
function visibleEdge(e){
  const a=nodeById[e.f], b=nodeById[e.t];
  if(!a||!b) return false;
  if(!visibleNode(a)||!visibleNode(b)) return false;
  if(state.collapsed[a.band]||state.collapsed[b.band]) return false;
  if(state.view==='cur' && e.kind==='tgt') return false;
  if(state.view==='tgt' && e.kind!=='tgt' && !(a.state!=='cur'&&b.state!=='cur')) return false;
  return true;
}

let LAYOUT={w:CANVAS_W,h:0,bands:[],clusters:[]};

function layout(){
  LAYOUT.bands=[]; LAYOUT.clusters=[];
  let y = MARGIN;
  BANDS.forEach(band=>{
    const anyNode = NODES.some(n=>n.band===band.id && visibleNode(n));
    if(!anyNode) return;
    const bandTop = y;
    if(state.collapsed[band.id]){
      LAYOUT.bands.push({...band, y:bandTop, h:46, collapsed:true});
      y += 46 + BGAP; return;
    }
    let x = MARGIN, rowH = 0, contentTop = bandTop + BHEAD;
    let rowTop = contentTop;
    CLUSTERS.filter(c=>c.band===band.id).forEach(cl=>{
      const ns = NODES.filter(n=>n.cluster===cl.id && visibleNode(n));
      if(!ns.length) return;
      const cols = Math.min(cl.cols, ns.length);
      const rows = Math.ceil(ns.length/cols);
      const w = cols*NW + (cols-1)*GX + CPAD*2;
      const h = rows*NH + (rows-1)*GY + CPAD*2 + CHEAD;
      if(x + w > CANVAS_W - MARGIN && x > MARGIN){ x = MARGIN; rowTop += rowH + CGAP; rowH = 0; }
      ns.forEach((n,i)=>{
        n.ax = x + CPAD + (i%cols)*(NW+GX);
        n.ay = rowTop + CPAD + CHEAD + Math.floor(i/cols)*(NH+GY);
      });
      LAYOUT.clusters.push({...cl, x, y:rowTop, w, h, color:band.color});
      x += w + CGAP; rowH = Math.max(rowH, h);
    });
    const bandH = (rowTop + rowH) - bandTop + CPAD;
    LAYOUT.bands.push({...band, y:bandTop, h:bandH, collapsed:false});
    y = bandTop + bandH + BGAP;
  });
  LAYOUT.h = y + MARGIN;
  NODES.forEach(n=>{ n.x = (n.ax||0)+n.dx; n.y = (n.ay||0)+n.dy; });
}

/* =======================================================================
   Rendering
   ======================================================================= */
const world = document.getElementById('world');
const svg   = document.getElementById('wires');
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

function anchors(a,b){
  const ax=a.x+NW/2, ay=a.y, bx=b.x+NW/2, by=b.y;
  if(by > ay + NH*0.6){                       // downward
    const y1=ay+NH, y2=by, dy=Math.max(26,(y2-y1)*0.42);
    return {d:`M${ax},${y1} C${ax},${y1+dy} ${bx},${y2-dy} ${bx},${y2}`, mx:(ax+bx)/2, my:(y1+y2)/2, up:false};
  }
  if(by < ay - NH*0.6){                       // upward / return
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x+NW, y2=b.y+NH/2;
    const bulge=Math.max(70, Math.abs(y1-y2)*0.16);
    return {d:`M${x1},${y1} C${x1+bulge},${y1} ${x2+bulge},${y2} ${x2},${y2}`, mx:Math.max(x1,x2)+bulge*0.72, my:(y1+y2)/2, up:true};
  }
  const l2r = b.x >= a.x;                     // lateral
  const x1 = l2r ? a.x+NW : a.x, x2 = l2r ? b.x : b.x+NW;
  const y1 = a.y+NH/2, y2 = b.y+NH/2, dx = Math.max(24,Math.abs(x2-x1)*0.4)*(l2r?1:-1);
  return {d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`, mx:(x1+x2)/2, my:(y1+y2)/2, up:false};
}

function relatives(id){
  const up=new Set(), down=new Set();
  const walk=(cur,dir,seen)=>{
    EDGES.filter(visibleEdge).forEach(e=>{
      const from = dir==='down'?e.f:e.t, to = dir==='down'?e.t:e.f;
      if(from===cur && !seen.has(to)){ seen.add(to); walk(to,dir,seen); }
    });
  };
  walk(id,'down',down); walk(id,'up',up);
  return {up,down};
}

function render(){
  layout(); drawSVG(); drawNodes();
  document.getElementById('s-nodes').textContent = NODES.filter(visibleNode).length;
  document.getElementById('s-edges').textContent = EDGES.filter(visibleEdge).length;
  document.getElementById('s-ctl').textContent   = CONTROLS.length;
}

function drawSVG(){
  world.style.width = LAYOUT.w+'px'; world.style.height = LAYOUT.h+'px';
  svg.setAttribute('width',LAYOUT.w); svg.setAttribute('height',LAYOUT.h);
  svg.innerHTML='';

  const defs = el('defs');
  [['ar','#8494A4'],['ar-t','#1F7A4C'],['ar-r','#A8791A'],['ar-hi','#131A22']].forEach(([id,c])=>{
    const m=el('marker',{id,viewBox:'0 0 8 8',refX:'7',refY:'4',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    m.appendChild(el('path',{d:'M0,0 L8,4 L0,8 z',fill:c})); defs.appendChild(m);
  });
  svg.appendChild(defs);

  const gBand=el('g'), gCl=el('g'), gEdge=el('g'), gLab=el('g'), gDia=el('g');
  svg.append(gBand,gCl,gEdge,gLab,gDia);

  /* band backgrounds */
  LAYOUT.bands.forEach(b=>{
    gBand.appendChild(el('rect',{x:MARGIN-30,y:b.y,width:LAYOUT.w-(MARGIN-30)*2,height:b.h,rx:8,
      fill:b.color,'fill-opacity':.035,stroke:b.color,'stroke-opacity':.16}));
    const g=el('g',{style:'cursor:pointer'}); g.dataset.band=b.id;
    const t1=el('text',{x:MARGIN-6,y:b.y+30,class:'bandnum',fill:b.color}); t1.textContent=b.n;
    const t2=el('text',{x:MARGIN+22,y:b.y+26,class:'bandlabel',fill:b.color}); t2.textContent=b.label;
    const t3=el('text',{x:MARGIN+22,y:b.y+41,class:'bandsub'}); t3.textContent=b.sub;
    const t4=el('text',{x:LAYOUT.w-MARGIN+22,y:b.y+26,class:'clabel',fill:b.color,'text-anchor':'end'});
    t4.textContent = state.collapsed[b.id] ? 'EXPAND +' : 'COLLAPSE −';
    g.append(t1,t2,t3,t4);
    g.addEventListener('click',()=>{ state.collapsed[b.id]=!state.collapsed[b.id]; render(); });
    gBand.appendChild(g);
    /* the ledger rule — signature element */
    const ledgerIn = EDGES.filter(e=>visibleEdge(e)&&nodeById[e.t].band==='b6'&&nodeById[e.f].band!=='b6').length;
    if(b.id==='b6' && !b.collapsed && ledgerIn>0){
      gBand.appendChild(el('line',{x1:MARGIN-30,y1:b.y+BHEAD-7,x2:LAYOUT.w-MARGIN+30,y2:b.y+BHEAD-7,
        stroke:'#A8791A','stroke-width':2.5}));
      const inbound = ledgerIn;
      const t=el('text',{x:LAYOUT.w-MARGIN+22,y:b.y+BHEAD-15,class:'clabel',fill:'#A8791A','text-anchor':'end'});
      t.textContent=`${inbound} FLOWS CROSS INTO THE LEDGER  \u25BC`;
      gBand.appendChild(t);
    }
  });

  /* cluster boxes */
  LAYOUT.clusters.forEach(c=>{
    gCl.appendChild(el('rect',{x:c.x,y:c.y,width:c.w,height:c.h,rx:5,fill:'#fff','fill-opacity':.62,
      stroke:c.color,'stroke-opacity':.28,'stroke-dasharray':'3 3'}));
    const t=el('text',{x:c.x+CPAD,y:c.y+16,class:'clabel',fill:c.color,'fill-opacity':.9});
    t.textContent=c.label; gCl.appendChild(t);
  });

  /* selection context */
  let up=new Set(), down=new Set();
  if(state.sel){ const r=relatives(state.sel); up=r.up; down=r.down; }
  const inScope = id => !state.sel || id===state.sel || up.has(id) || down.has(id);
  const q = state.query.trim().toLowerCase();

  /* edges */
  EDGES.filter(visibleEdge).forEach((e,i)=>{
    const a=nodeById[e.f], b=nodeById[e.t];
    const A=anchors(a,b);
    const active = !state.sel || (inScope(e.f)&&inScope(e.t)&&(e.f===state.sel||e.t===state.sel||(up.has(e.f)&&up.has(e.t))||(down.has(e.f)&&down.has(e.t))));
    const isTgt = e.kind==='tgt', isRet = e.kind==='ret';
    const stroke = isTgt?'#1F7A4C':(isRet?'#A8791A':(bandById[a.band].color));
    const p = el('path',{d:A.d,fill:'none',stroke,
      'stroke-width':active&&state.sel?2.1:1.15,
      'stroke-opacity':state.sel?(active?.95:.06):(isTgt?.55:.42),
      'stroke-dasharray':isTgt?'5 4':(isRet?'2 3':''),
      'marker-end':`url(#${isTgt?'ar-t':(isRet?'ar-r':'ar')})`});
    gEdge.appendChild(p);
    const hit=el('path',{d:A.d,class:'hit'});
    hit.addEventListener('click',ev=>{ev.stopPropagation();showEdge(e);});
    hit.addEventListener('mouseenter',()=>{p.setAttribute('stroke-width',2.6);p.setAttribute('stroke-opacity',1);});
    hit.addEventListener('mouseleave',()=>{p.setAttribute('stroke-width',active&&state.sel?2.1:1.15);p.setAttribute('stroke-opacity',state.sel?(active?.95:.06):(isTgt?.55:.42));});
    gEdge.appendChild(hit);

    if(e.label && (state.labels || (state.sel&&active))){
      const txt=el('text',{x:A.mx,y:A.my+3,class:'elabel','text-anchor':'middle'});
      txt.textContent = e.label.length>62 ? e.label.slice(0,60)+'…' : e.label;
      gLab.appendChild(txt);
      const bb=txt.getBBox();
      const bg=el('rect',{x:bb.x-4,y:bb.y-2,width:bb.width+8,height:bb.height+4,class:'elabel-bg',rx:2});
      gLab.insertBefore(bg,txt);
    }
    if(e.ctl && state.ctl){
      const g=el('g',{class:'cdia',transform:`translate(${A.mx},${A.my})`});
      g.appendChild(el('rect',{x:-9,y:-9,width:18,height:18,transform:'rotate(45)',rx:2,
        fill:'#A8791A',stroke:'#fff','stroke-width':1.5,'fill-opacity':state.sel&&!active?.12:1}));
      const t=el('text',{y:2.7,'text-anchor':'middle'}); t.textContent=e.ctl.replace('C','');
      g.appendChild(t);
      g.addEventListener('click',ev=>{ev.stopPropagation();showControl(e.ctl);});
      gDia.appendChild(g);
    }
  });

}

function drawNodes(){
  let up=new Set(), down=new Set();
  if(state.sel){ const r=relatives(state.sel); up=r.up; down=r.down; }
  const q = state.query.trim().toLowerCase();
  world.querySelectorAll('.node').forEach(n=>n.remove());
  NODES.filter(n=>visibleNode(n)&&!state.collapsed[n.band]).forEach(n=>{
    const d=document.createElement('div');
    d.className='node'; d.dataset.id=n.id;
    d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${NW}px;min-height:${NH}px;--nc:${bandById[n.band].color}`;
    if(n.state==='tgt') d.classList.add('tgt');
    if(state.sel===n.id) d.classList.add('sel');
    else if(state.sel){ if(up.has(n.id)) d.classList.add('up'); else if(down.has(n.id)) d.classList.add('down'); else d.classList.add('dim'); }
    if(q){ if((n.label+' '+n.sub).toLowerCase().includes(q)) d.classList.add('hit'); else d.classList.add('dim'); }
    if(state.decom && n.flag==='decom') d.style.background='repeating-linear-gradient(135deg,#fff,#fff 5px,#FBECEA 5px,#FBECEA 10px)';
    let chip='';
    if(n.state==='tgt') chip='<span class="chip t">TARGET</span>';
    else if(n.flag==='decom') chip='<span class="chip d">EXIT</span>';
    const cbar = (n.d.ctl&&n.d.ctl.length&&state.ctl) ? `<div class="cbar">${n.d.ctl.map(c=>`<span>${c}</span>`).join('')}</div>` : '';
    d.innerHTML=`${chip}<div class="lbl">${n.label}</div><div class="sub">${n.sub}</div>${cbar}`;
    world.appendChild(d);
  });

}

/* =======================================================================
   Panel
   ======================================================================= */
const panel=document.getElementById('panel');
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function showHome(){
  state.sel=null;
  panel.innerHTML=`
  <div class="phead"><div class="kicker">How to read this map</div>
    <h2>Everything flows down to the ledger</h2>
    <div class="meta">Eight bands, source at the top, reporting at the bottom.</div></div>
  <div class="body">
    <div class="field"><h3>Start here</h3>
      <p>Click any system to trace its complete path — everything upstream of it in blue, everything downstream in gold, everything else faded. Click a <b>gold diamond</b> on a flow line to read the control that sits on it.</p></div>
    <div class="field"><h3>Bands</h3><div class="legend">
      ${BANDS.map(b=>`<div><span class="swatch" style="background:${b.color}"></span><b style="font-weight:600">${b.n}. ${b.label}</b></div>`).join('')}
    </div></div>
    <div class="field"><h3>Line &amp; box notation</h3><div class="legend">
      <div><span class="swatch" style="background:#8494A4"></span>Data moving forward</div>
      <div><span class="swatch" style="background:#A8791A"></span>Returning to an earlier stage (dotted)</div>
      <div><span class="swatch" style="background:#1F7A4C"></span>Target-state flow (dashed)</div>
      <div><span class="swatch" style="background:#A8791A;transform:rotate(45deg);border-radius:1px"></span>Control point on the flow</div>
      <div><span class="swatch" style="border:1px dashed #1F7A4C;background:#F0F8F3"></span>Target-state system</div>
      <div><span class="swatch" style="background:repeating-linear-gradient(135deg,#fff,#fff 3px,#FBECEA 3px,#FBECEA 6px);border:1px solid #CFD8E0"></span>Exit / decommission candidate</div>
    </div></div>
    <div class="field"><h3>Control points</h3>
      <div id="ctl-list">${CONTROLS.map(c=>`
        <div class="ctl" data-c="${c.id}"><div class="ctl-h"><span class="ctl-id">${c.id}</span><span class="ctl-t">${esc(c.t)}</span></div>
        <div class="ctl-d">${esc(c.d)}</div></div>`).join('')}</div></div>
    <div class="field"><h3>Editing</h3>
      <p class="note">Drag any box to reposition it. Double-click a box to rename it. Collapse a whole band by clicking its heading. <kbd>Esc</kbd> clears a selection. Use <b>Save layout</b> to keep your edits as a file and <b>Load layout</b> to bring them back.</p></div>
  </div>`;
  panel.querySelectorAll('.ctl').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('open')));
}

function showNode(id){
  state.sel=id; const n=nodeById[id], b=bandById[n.band], d=n.d||{};
  const ins  = EDGES.filter(e=>e.t===id&&visibleEdge(e));
  const outs = EDGES.filter(e=>e.f===id&&visibleEdge(e));
  const row = (e,other)=>{const o=nodeById[other];return `<li data-go="${other}" style="--dot:${bandById[o.band].color}"><b>${esc(o.label)}</b>${e.label?`<span>${esc(e.label)}</span>`:''}</li>`;};
  panel.innerHTML=`
  <div class="phead">
    <div class="kicker" style="color:${b.color}">Band ${b.n} · ${esc(b.label)}</div>
    <h2>${esc(n.label)}</h2>
    <div class="meta">${esc(n.sub)}${d.freq?` &nbsp;·&nbsp; ${esc(d.freq)}`:''}${d.own?` &nbsp;·&nbsp; ${esc(d.own)}`:''}
    ${n.state==='tgt'?' &nbsp;·&nbsp; <b style="color:#1F7A4C">Target state</b>':''}
    ${n.flag==='decom'?' &nbsp;·&nbsp; <b style="color:#B03A2E">Exit candidate</b>':''}</div>
  </div>
  <div class="body">
    ${d.in  ?`<div class="field"><h3>What enters</h3><p>${esc(d.in)}</p></div>`:''}
    ${d.proc?`<div class="field"><h3>What happens to it</h3><p>${esc(d.proc)}</p></div>`:''}
    ${d.out ?`<div class="field"><h3>Where it goes</h3><p>${esc(d.out)}</p></div>`:''}
    ${(d.ctl&&d.ctl.length)?`<div class="field"><h3>Controls on this system</h3>
      ${d.ctl.map(c=>ctlById[c]?`<div class="ctl" data-c="${c}"><div class="ctl-h"><span class="ctl-id">${c}</span><span class="ctl-t">${esc(ctlById[c].t)}</span></div><div class="ctl-d">${esc(ctlById[c].d)}</div></div>`:'').join('')}</div>`:''}
    <div class="field"><h3>Receives from (${ins.length})</h3>
      ${ins.length?`<ul class="flowlist">${ins.map(e=>row(e,e.f)).join('')}</ul>`:'<p style="font-size:12px;color:#6C7C8C">Originating system — data starts here.</p>'}</div>
    <div class="field"><h3>Sends to (${outs.length})</h3>
      ${outs.length?`<ul class="flowlist">${outs.map(e=>row(e,e.t)).join('')}</ul>`:'<p style="font-size:12px;color:#6C7C8C">Terminal system — nothing flows onward.</p>'}</div>
    <div class="field"><button class="tbtn" id="clear">Clear selection</button></div>
  </div>`;
  panel.querySelectorAll('.ctl').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('open')));
  panel.querySelectorAll('[data-go]').forEach(li=>li.addEventListener('click',()=>{showNode(li.dataset.go);render();}));
  const cb=document.getElementById('clear'); if(cb) cb.addEventListener('click',()=>{showHome();render();});
  panel.scrollTop=0;
}

function showEdge(e){
  const a=nodeById[e.f], b=nodeById[e.t];
  panel.innerHTML=`
  <div class="phead"><div class="kicker">Data flow</div>
    <h2>${esc(a.label)} → ${esc(b.label)}</h2>
    <div class="meta">${e.kind==='tgt'?'Target state':(e.kind==='ret'?'Return flow to an earlier stage':'Forward flow')}</div></div>
  <div class="body">
    <div class="field"><h3>What moves</h3><p>${esc(e.label||'Data transfer between these systems.')}</p></div>
    ${e.ctl&&ctlById[e.ctl]?`<div class="field"><h3>Control on this flow</h3>
      <div class="ctl open"><div class="ctl-h"><span class="ctl-id">${e.ctl}</span><span class="ctl-t">${esc(ctlById[e.ctl].t)}</span></div>
      <div class="ctl-d">${esc(ctlById[e.ctl].d)}</div></div></div>`:''}
    <div class="field"><button class="tbtn" data-go="${a.id}">Open ${esc(a.label)}</button>
      <button class="tbtn" data-go="${b.id}" style="margin-top:6px">Open ${esc(b.label)}</button></div>
  </div>`;
  panel.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>{showNode(x.dataset.go);render();}));
}

function showControl(id){
  const c=ctlById[id]; if(!c) return;
  const on=EDGES.filter(e=>e.ctl===id&&visibleEdge(e));
  panel.innerHTML=`
  <div class="phead"><div class="kicker" style="color:#A8791A">Control point ${id}</div>
    <h2>${esc(c.t)}</h2><div class="meta">Applied on ${on.length} mapped flow${on.length===1?'':'s'}</div></div>
  <div class="body">
    <div class="field"><h3>What the control does</h3><p>${esc(c.d)}</p></div>
    <div class="field"><h3>Where it sits</h3><ul class="flowlist">
      ${on.map(e=>`<li data-go="${e.f}" style="--dot:#A8791A"><b>${esc(nodeById[e.f].label)} → ${esc(nodeById[e.t].label)}</b><span>${esc(e.label||'')}</span></li>`).join('')}
    </ul></div>
    <div class="field"><button class="tbtn" id="home">Back to overview</button></div>
  </div>`;
  panel.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>{showNode(x.dataset.go);render();}));
  document.getElementById('home').addEventListener('click',()=>{showHome();render();});
}

/* =======================================================================
   Interaction — pan, zoom, drag, rename
   ======================================================================= */
const vp=document.getElementById('viewport');
let tx=0,ty=0,k=.62;
const apply=()=>world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;

vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const nk=Math.min(2.4,Math.max(.12,k*(e.deltaY<0?1.12:1/1.12)));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; apply();
},{passive:false});

let pan=null, drag=null;
vp.addEventListener('pointerdown',e=>{
  const nd=e.target.closest('.node');
  if(nd && !nd.isContentEditable){
    const n=nodeById[nd.dataset.id];
    drag={n,el:nd,sx:e.clientX,sy:e.clientY,ox:n.dx,oy:n.dy,moved:false};
    nd.classList.add('dragging'); nd.setPointerCapture(e.pointerId);
  } else if(!e.target.closest('.cdia') && !e.target.closest('[data-band]')){
    pan={sx:e.clientX,sy:e.clientY,tx,ty}; vp.classList.add('grabbing');
  }
});
window.addEventListener('pointermove',e=>{
  if(drag){
    const dx=(e.clientX-drag.sx)/k, dy=(e.clientY-drag.sy)/k;
    if(Math.abs(dx)>1.5||Math.abs(dy)>1.5) drag.moved=true;
    drag.n.dx=drag.ox+dx; drag.n.dy=drag.oy+dy;
    drag.n.x=drag.n.ax+drag.n.dx; drag.n.y=drag.n.ay+drag.n.dy;
    drag.el.style.left=drag.n.x+'px'; drag.el.style.top=drag.n.y+'px';
    renderWires();
  } else if(pan){ tx=pan.tx+(e.clientX-pan.sx); ty=pan.ty+(e.clientY-pan.sy); apply(); }
});
window.addEventListener('pointerup',e=>{
  if(drag){
    drag.el.classList.remove('dragging');
    if(!drag.moved){ showNode(drag.n.id); render(); }
    drag=null;
  }
  pan=null; vp.classList.remove('grabbing');
});
function renderWires(){ drawSVG(); }

world.addEventListener('dblclick',e=>{
  const nd=e.target.closest('.node'); if(!nd) return;
  e.preventDefault();
  const n=nodeById[nd.dataset.id], lbl=nd.querySelector('.lbl');
  lbl.contentEditable='true'; lbl.focus();
  document.getSelection().selectAllChildren(lbl);
  const done=()=>{ lbl.contentEditable='false'; n.label=lbl.textContent.trim()||n.label; lbl.textContent=n.label;
    lbl.removeEventListener('blur',done); render(); toast('Renamed'); };
  lbl.addEventListener('blur',done);
  lbl.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();lbl.blur();} if(ev.key==='Escape'){lbl.textContent=n.label;lbl.blur();} });
});
vp.addEventListener('click',e=>{ if(e.target===vp||e.target===world||e.target===svg){ showHome(); render(); }});
window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!document.querySelector('[contenteditable="true"]')){ showHome(); render(); }});

/* =======================================================================
   Toolbar
   ======================================================================= */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
document.querySelectorAll('#seg-view button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#seg-view button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); state.view=b.dataset.v; state.sel=null; showHome(); render(); fit();
}));
const tog=(id,key,after)=>document.getElementById(id).addEventListener('click',e=>{
  state[key]=!state[key]; e.currentTarget.classList.toggle('on',state[key]); render(); if(after)after();
});
tog('t-labels','labels'); tog('t-ctl','ctl'); tog('t-decom','decom');
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;render();});
document.getElementById('t-reset').addEventListener('click',()=>{NODES.forEach(n=>{n.dx=0;n.dy=0;});render();fit();toast('Layout reset');});
document.getElementById('t-fit').addEventListener('click',()=>fit());
document.getElementById('t-print').addEventListener('click',()=>{fit();setTimeout(()=>window.print(),200);});
document.getElementById('t-save').addEventListener('click',()=>{
  const data={v:1,saved:new Date().toISOString(),
    nodes:NODES.map(n=>({id:n.id,label:n.label,sub:n.sub,dx:n.dx,dy:n.dy})),
    collapsed:state.collapsed,view:state.view};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='intact-data-flow-map-layout.json'; a.click(); toast('Layout saved');
});
document.getElementById('t-load').addEventListener('click',()=>document.getElementById('file').click());
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    (d.nodes||[]).forEach(s=>{const n=nodeById[s.id]; if(!n)return; n.label=s.label??n.label; n.sub=s.sub??n.sub; n.dx=s.dx||0; n.dy=s.dy||0;});
    if(d.collapsed) state.collapsed=d.collapsed;
    if(d.view){ state.view=d.view; document.querySelectorAll('#seg-view button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===d.view))); }
    render(); fit(); toast('Layout loaded');
  }catch(err){ toast('That file could not be read'); } };
  r.readAsText(f); e.target.value='';
});

function fit(){
  const r=vp.getBoundingClientRect();
  k=Math.min(r.width/(LAYOUT.w+40), r.height/(LAYOUT.h+40), 1.4);
  tx=(r.width-LAYOUT.w*k)/2; ty=16; apply();
}

showHome(); render(); fit();
window.addEventListener('resize',()=>{ /* keep transform */ });
</script>
</body>
